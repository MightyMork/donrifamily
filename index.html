// ---------- recording ----------
async function fvMic(){
  if(fvS.stream) return fvS.stream;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){ const e = new Error("none"); e.name = "NotSupported"; throw e; }
  fvS.stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true}}); return fvS.stream;
}
function fvMicOff(){ if(!fvS) return; if(fvS.stream){ fvS.stream.getTracks().forEach(t => t.stop()); fvS.stream = null; } if(fvS.ac){ try{ fvS.ac.close(); }catch(e){} fvS.ac = null; } }
async function fvRecStart(){
  if(!fvS || fvS.recording || fvS.starting) return; fvStopAll();
  if(fvS.useFile) return fvPickFile();
  if(fvS.fake){ fvS.recording = true; fvS.t0 = Date.now(); fvDraw(); fvTick(); return; }
  fvS.starting = true; let s;
  try{ s = await fvMic(); }catch(e){ fvS.starting = false; fvS.err = (e && (e.name === "NotAllowedError" || e.name === "SecurityError")) ? "blocked" : "none"; fvDraw(); return; }
  fvS.starting = false; if(!fvS) return;
  const mt = ["audio/webm;codecs=opus","audio/mp4","audio/webm","audio/ogg;codecs=opus"].find(t => { try{ return MediaRecorder.isTypeSupported(t); }catch(e){ return false; } });
  let mr; try{ mr = mt ? new MediaRecorder(s, {mimeType:mt, audioBitsPerSecond:64000}) : new MediaRecorder(s); }catch(e){ fvS.err = "none"; fvDraw(); return; }
  const chunks = [], t0 = Date.now();
  mr.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
  mr.onstop = () => { const blob = new Blob(chunks, {type:mr.mimeType || mt || "audio/webm"}); fvGotTake({blob, ms:Date.now() - t0}); };
  fvS.err = ""; fvS.mr = mr; fvS.recording = true; fvS.t0 = t0; mr.start(); fvDraw(); fvMeter(s); fvTick();
}
// The Claude preview blocks the microphone, but a file input still works: on Android it opens the phone's own sound recorder.
function fvPickFile(){
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = "audio/*"; inp.setAttribute("capture", "");
  inp.onchange = () => { const f = inp.files && inp.files[0]; if(!f) return; if(f.size > 8e6){ toast("That recording is too long. Keep each line short."); return; } fvGotTake({blob:f, ms:9999}); };
  inp.click();
}
function fvMeter(stream){
  try{ const AC = window.AudioContext || window.webkitAudioContext; if(!fvS.ac) fvS.ac = new AC(); const ac = fvS.ac; if(ac.state === "suspended") ac.resume();
    const src = ac.createMediaStreamSource(stream), an = ac.createAnalyser(); an.fftSize = 512; src.connect(an); const buf = new Uint8Array(an.fftSize);
    const loop = () => { if(!fvS || !fvS.recording){ try{ src.disconnect(); }catch(e){} return; } an.getByteTimeDomainData(buf); let pk = 0; for(const x of buf) pk = Math.max(pk, Math.abs(x - 128));
      const lvl = Math.min(1, pk / 64), bars = document.querySelectorAll("#fv .fv-lvl i"); bars.forEach((b, k) => b.classList.toggle("on", k / bars.length < lvl)); requestAnimationFrame(loop); };
    loop(); }catch(e){}
}
function fvTick(){
  const id = setInterval(() => { if(!fvS || !fvS.recording || fvS.tick !== id){ clearInterval(id); return; }
    const s = Math.floor((Date.now() - fvS.t0) / 1000), t = document.querySelector("#fv .fv-time"); if(t) t.textContent = "0:" + String(s).padStart(2, "0");
    if(fvS.fake) document.querySelectorAll("#fv .fv-lvl i").forEach((b, k) => b.classList.toggle("on", Math.random() < .75 - k / 18));
    if(s >= 30) fvRecStop(); }, 200);
  fvS.tick = id;
}
function fvRecStop(cancel){
  if(!fvS || !fvS.recording) return; clearInterval(fvS.tick); fvS.tick = 0;
  if(cancel){ fvS.recording = false; fvS.cancel = true; try{ if(fvS.mr && fvS.mr.state !== "inactive") fvS.mr.stop(); }catch(e){} return; }
  if(fvS.fake){ fvGotTake({fake:true, ms:Date.now() - fvS.t0}); return; }
  try{ fvS.mr.stop(); }catch(e){ fvS.recording = false; fvDraw(); }
}
function fvGotTake(val){
  if(!fvS) return; if(fvS.cancel){ fvS.cancel = false; return; } fvS.recording = false;
  if(!val.fake && val.ms < 500){ toast("That was very quick. Tap record, read the line, then tap stop."); fvDraw(); return; }
  if(fvS.view === "practice"){ fvS.practice = val; fvDraw(); return; }
  const st = fvStory(), v = fvVoice(); if(!v) return; const it = fvScript(st, v)[fvS.i]; const key = fvKey(v.id, st.id, it.k);
  fvPutClip(key, {...val, at:Date.now()}); fvMark(key); if(val.fake && !v.fake){ v.fake = true; fvPutVoice(v); }
  fvDraw();
}
function fvItem(){ if(fvS.view === "practice") return FV_PRACTICE; const v = fvVoice(); return v ? fvScript(fvStory(), v)[fvS.i] : null; }
function fvAct(act, v){
  if(!fvS) return;
  if(act === "fvClose") return fvClose();
  if(act === "fvBackList"){ fvRecStop(true); return fvView("list"); }
  if(act === "fvNew"){ Object.assign(fvS, {vid:"", name:"", rel:"", colour:FV_COLS[fvVoices.length % FV_COLS.length], practice:null}); return fvView("who"); }
  if(act === "fvRel"){ fvS.rel = v; return fvDraw(); }
  if(act === "fvCol"){ fvS.colour = v; return fvDraw(); }
  if(act === "fvWhoNext"){ const name = (fvS.name || "").trim() || fvS.rel; if(!name){ toast("Add your name first"); const i = document.getElementById("fvName"); if(i) i.focus(); return; }
    const voice = {id:"v" + uid(), name, rel:fvS.rel || "Family", colour:fvS.colour, created:Date.now(), by:myName()}; fvPutVoice(voice); fvVoices.push(voice); fvS.vid = voice.id; fvS.practice = null; return fvView("practice"); }
  if(act === "fvGo"){ const voice = fvVoices.find(x => x.id === v); if(!voice) return; fvS.vid = v; const st = fvStory(), S = fvScript(st, voice);
    const any = S.some(x => fvHas(v, st.id, x.k)); const miss = S.findIndex(x => !x.hello && !fvHas(v, st.id, x.k)); fvS.i = !any ? 0 : miss < 0 ? 1 : miss; return fvView("rec"); }
  if(act === "fvStartLines"){ fvS.i = 0; return fvView("rec"); }
  if(act === "fvRec") return fvRecStart();
  if(act === "fvStop") return fvRecStop();
  if(act === "fvRetry"){ fvS.err = ""; return fvRecStart(); }
  if(act === "fvUseFile"){ fvS.useFile = true; fvS.err = ""; fvDraw(); return fvPickFile(); }
  if(act === "fvFake"){ fvS.fake = true; fvS.err = ""; toast("Pretend recordings: the phone’s voice stands in, so you can try everything."); return fvDraw(); }
  if(act === "fvExample"){ const it = fvItem(); if(it) fvSpeak(it.text, it.cues); return; }
  if(act === "fvPlayTake"){ const it = fvItem(); if(!it) return; if(fvS.view === "practice") return fvPlayVal(fvS.practice, it); const vo = fvVoice(); fvGetClip(fvKey(vo.id, fvS.sid, it.k)).then(val => fvPlayVal(val, it)); return; }
  if(act === "fvPrev"){ if(fvS.i > 0){ fvS.i--; fvView("rec"); } return; }
  if(act === "fvNext"){ const st = fvStory(), vo = fvVoice(), S = fvScript(st, vo);
    if(fvS.i < S.length - 1){ fvS.i++; return fvView("rec"); }
    if(fvReady(vo, st)) return fvView("done");
    fvS.i = S.findIndex(x => !x.hello && !fvHas(vo.id, st.id, x.k)); toast("Nearly there! A few lines still to do."); return fvView("rec"); }
  if(act === "fvDel"){ // anyone can record a voice, but removing one needs the grown-up PIN
    const vo = fvVoices.find(x => x.id === v); if(!vo) return; fvS.del = "";
    if(!kidSettings().pin){ toast("Set a grown-up PIN first, then tap Remove again"); return pinSetSheet(""); }
    return pinSheet("Remove " + vo.name + "’s voice?", () => { closeSheet(); fvDelVoice(v); toast("That voice is removed from this phone"); if(fvS) fvDraw(); }); }
}

function fvHelloPlay(vid){

function fvDemo(){

// ---------- Listen: the picture book, read by the chosen voice, line by line ----------
function fvListenOpen(vid, sid){
  if(sid) storyId = sid; const v = fvVoices.find(x => x.id === vid), st = curStory(); if(!v || !st) return;
  storyStop(); fvStopAll(); const old = document.getElementById("book"); if(old) old.remove();
  const el = document.createElement("div"); el.id = "book"; el.className = "fv-listen"; el.setAttribute("role", "dialog"); el.setAttribute("aria-label", st.title + ", read by " + v.name);
  el.innerHTML = `<div class="bk-stage" id="bkStage">${bookPageHTML(st, 0)}</div>
    <div class="bk-bar"><button class="bk-ic" data-act="bookClose" aria-label="Close the book">✕</button><button class="bk-ic fv-pp" data-act="fvPP" aria-label="Pause">❚❚</button><span class="fv-by">${fvAv(v, 'sm')}Read by ${esc(v.name)}</span></div>
    <button class="bk-nav prev" data-act="bookTurn" data-v="-1" aria-label="Previous page">‹</button>
    <button class="bk-nav next" data-act="bookTurn" data-v="1" aria-label="Next page">›</button>
    <div class="fv-hello" hidden>${fvAv(v, 'big')}<span>${esc(v.name)} says hello!</span></div>
    <div class="bk-rotate" aria-hidden="true">↻ Turn sideways for a bigger book</div>`;
  document.body.appendChild(el); document.body.classList.add("bookopen");
  try{ const p = el.requestFullscreen ? el.requestFullscreen() : null; if(p && p.then) p.then(() => { try{ screen.orientation.lock("landscape").catch(() => {}); }catch(e){} }).catch(() => {}); }catch(e){}
  el.addEventListener("touchstart", e => { const t = e.touches[0]; bookTouch = {x:t.clientX, y:t.clientY}; }, {passive:true});
  el.addEventListener("touchend", e => { if(!bookTouch) return; const t = e.changedTouches[0], dx = t.clientX - bookTouch.x, dy = t.clientY - bookTouch.y; bookTouch = null; if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) fvListenGo(dx < 0 ? 1 : -1); }, {passive:true});
  bookPage = 0; storyFinished = false; fvL = {v, st, page:0, line:-1, playing:true, tok:0, finished:false}; bookNavState(st); fvRun();
}
function fvHi(l){
  document.querySelectorAll("#book .bk-page:not(.bk-leave)").forEach(p => p.querySelectorAll(".bk-l").forEach((x, k) => x.classList.toggle("fv-now", k === l)));
  const b = document.getElementById("book"); if(b) b.classList.toggle("fv-reading", l >= 0);
}
function fvHelloBox(on){ const h = document.querySelector("#book .fv-hello"); if(h) h.hidden = !on; }
function fvBar(){ const b = document.querySelector("#book .fv-pp"); if(b && fvL){ b.textContent = fvL.playing ? "❚❚" : "▶"; b.setAttribute("aria-label", fvL.playing ? "Pause" : "Play"); } }
function fvPageAnim(st, from, to){
  const stage = document.getElementById("bkStage"); if(!stage) return; bookPage = to;
  stage.innerHTML = to > from ? bookPageHTML(st, to) + bookPageHTML(st, from, "bk-leave") : bookPageHTML(st, from) + bookPageHTML(st, to, "bk-arrive");
  if(soundOn()) sfx("page"); else if(!activeBoy()){ try{ SFX.page(); }catch(e){} }
  setTimeout(() => { if(bookPage === to && document.getElementById("bkStage") === stage){ stage.innerHTML = bookPageHTML(st, to); fvHi(fvL && fvL.playing ? fvL.line : -1); } }, 620);
  bookNavState(st);
}
function fvAtEnd(L){ L.playing = false; fvBar(); fvHi(-1); if(!L.finished){ L.finished = true; setTimeout(() => { if(fvL === L) storyFinish(L.st); }, 700); } }
async function fvRun(){
  const L = fvL; if(!L) return; const my = ++L.tok; const alive = () => fvL === L && L.tok === my && L.playing; fvBar();
  while(alive()){
    const st = L.st, n = st.pages.length;
    if(L.page >= n) return fvAtEnd(L);
    if(L.line === -1){ L.line = 0;
      if(L.page === 0 && fvHas(L.v.id, st.id, "hello")){ fvHi(-1); fvHelloBox(true); const val = await fvGetClip(fvKey(L.v.id, st.id, "hello")); if(!alive()){ fvHelloBox(false); return; }
        await fvPlayVal(val, fvScript(st, L.v)[0]); fvHelloBox(false); if(!alive()) return; await fvWait(500); }
      continue; }
    const pg = st.pages[L.page];
    if(L.line >= pg.lines.length){ fvHi(-1); await fvWait(900); if(!alive()) return; const from = L.page; L.page++; L.line = 0; fvPageAnim(st, from, L.page); if(L.page >= n) return fvAtEnd(L); await fvWait(700); continue; }
    const k = L.page + "-" + L.line; fvHi(L.line);
    if(fvHas(L.v.id, st.id, k)){ const val = await fvGetClip(fvKey(L.v.id, st.id, k)); if(!alive()) return; await fvPlayVal(val, {text:pg.lines[L.line], cues:((((st.voice || [])[L.page]) || [])[L.line] || "").split(" ").filter(Boolean)}); }
    if(!alive()) return; await fvWait(350); if(!alive()) return; L.line++;
  }
}
function fvPP(){ const L = fvL; if(!L) return; if(L.playing){ L.playing = false; L.tok++; fvStopAll(); fvHelloBox(false); fvHi(-1); fvBar(); } else { if(L.page >= L.st.pages.length) return; L.playing = true; fvRun(); } }
function fvListenGo(d){
  const L = fvL; if(!L) return; const n = L.st.pages.length, to = L.page + d; if(to < 0 || to > n) return;
  L.tok++; fvStopAll(); fvHelloBox(false); const from = L.page; L.page = to; L.line = 0; fvPageAnim(L.st, from, to);
  if(to === n) return fvAtEnd(L);
  if(L.playing) setTimeout(() => { if(fvL === L && L.page === to && L.playing) fvRun(); }, 650);
}
function fvListenStop(){ if(fvL){ fvL.tok++; fvL.playing = false; fvL = null; } fvStopAll(); }
function fvListenAgain(){ const L = fvL; if(!L) return; L.tok++; fvStopAll(); const stage = document.getElementById("bkStage"); bookPage = 0; if(stage) stage.innerHTML = bookPageHTML(L.st, 0); Object.assign(L, {page:0, line:-1, playing:true, finished:false}); bookNavState(L.st); fvRun(); }
fvLoad();

  if(act === "storyCoverBack"){ storyStop(); storyMode = ""; storyPage = -1; kdGame = null; render(); window.scrollTo(0,0); }
  if(act === "storyFilm") storyFilm();
  if(act === "sfilmEnd") storyFilmEnd(true);
  if(act === "sfilmSkip") storyFilmCover(true);
  if(act === "sfilmAgain") storyFilm();
  if(act === "sfilmShelf"){ storyFilmEnd(true); storyStop(); storyId = ""; storyMode = ""; storyPage = -1; kdGame = null; render(); window.scrollTo(0,0); }
  if(act === "sfilmPick"){ storyFilmEnd(true); if(v === "book"){ if(!document.getElementById("book")) bookOpen(); } else { const bk = document.getElementById("book"); if(bk) bookClose(); storyStop(); storyMode = v === "voices" ? "voices" : "kid"; storyPage = -1; storyWord = -1; kdGame = null; render(); window.scrollTo(0,0); if(v === "voices") say("Who's reading tonight?"); } }
  if(act === "kdStart"){ storyStop(); storyMode = "kid"; storyPage = -1; storyWord = -1; kdGame = null; render(); window.scrollTo(0,0); }
  if(act === "kdTurn") kdTurn(Number(v));

  if(act === "kdHearLine") kdReadLine();
  if(act === "kdSay"){ storyStop(); say(stSpeak(v)); if(b.dataset.i !== undefined){ storyWord = Number(b.dataset.i); document.querySelectorAll(".kd-line .kd-w").forEach((x,k) => x.classList.toggle("on", k === storyWord)); } }

const fmtLeft = s => s >= 60 ? Math.ceil(s/60) + " min" : s + " sec";

    const s = localSecs(playKid) + 5; ls.set("donri.play." + playId(playKid), s);
    if(s % 60 === 0) put("play", playId(playKid), {...playDoc(playKid), kid:playKid, date:today(), secs:Math.max(s, Number(playDoc(playKid).secs)||0)});

document.addEventListener("click", e => {

    case "cevNew": cevForm(); break;
    case "cevEdit": cevForm(id); break;
    case "cevOpen": { const ev = doc("c_events", id); if(!ev) break; openSheet(ev.title, () => cevCard(doc("c_events", id) || ev)); break; }

    case "cevCancel": { const ev = doc("c_events", id); if(!ev) break; patch("c_events", id, {status:"cancelled"}); notifyFamilies(Object.keys(ev.invites||{}), "Get-together cancelled", `${famName()} cancelled ${ev.title} (${nice(ev.date)})`); closeSheet(); toast("Cancelled, and everyone invited was told"); break; }

    case "pollClose": { const p = doc("c_polls", id); if(!p) break; const votes = p.votes || {}; const counts = p.options.map((_,i) => Object.values(votes).filter(x => (x||[]).includes(i)).length); const top = counts.indexOf(Math.max(...counts));

    case "pollDel": del("c_polls", id); toast("Poll deleted"); break;

    case "wishDel": del("c_wishes", id); break;

const phCache = {}; let phBusy = {}, phT = null, phCheckAt = 0;
function phSrc(p, size){
  if(p.photo) return `src="${esc(p.photo)}"`;
  if(!p.file) return `src="${BLANK_IMG}"`;
  const c = phCache[p.file + size]; if(c && Date.now() - c.at < 45 * 60000) return `src="${esc(c.url)}"`;
  clearTimeout(phT); phT = setTimeout(phHydrate, 30);

}
async function phUrl(file, size){
  const k = file + size, c = phCache[k]; if(c && Date.now() - c.at < 45 * 60000) return c.url;
  if(phBusy[k]) return phBusy[k];
  phBusy[k] = (async () => { try{
    let j; try{ j = await graphJson(`/drives/${cfg.d}/items/${file}/thumbnails`); }catch(e){ if(!cfg.p) throw e; j = await graphJson(`/shares/${shareId(cfg.p)}/items/${file}/thumbnails`); } const t = (j.value || [])[0] || {};
    let url = (t[size] || t.large || t.medium || {}).url;
    if(!url){ const m = await graphJson(`/drives/${cfg.d}/items/${file}?select=id,@microsoft.graph.downloadUrl`); url = m["@microsoft.graph.downloadUrl"]; }
    if(url) phCache[k] = {url, at:Date.now()}; return url || "";
  }catch(e){ return ""; } finally{ delete phBusy[k]; } })();
  return phBusy[k];
}
function phHydrate(){ document.querySelectorAll("img[data-ph]").forEach(async img => { const f = img.dataset.ph, sz = img.dataset.sz || "medium"; img.removeAttribute("data-ph"); const u = await phUrl(f, sz); if(u) img.src = u; else img.alt = "Photo not available offline"; }); }

  let ps = photoSet(), folder = ps.folder;

  try{
    if(!folder){
      let j; try{ j = await graphJson(`/drives/${cfg.d}/items/${cfg.f}/children`, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({name:"Photos", folder:{}, "@microsoft.graph.conflictBehavior":"fail"})}); }

    if(!want.length) return;

function photoBlob(file){

function medInfo(m){
  const per = Number(m.perDay)||0, stock = Number(m.stock)||0;
  const left = per ? Math.floor(stock/per) : null;
  const runOut = left!=null ? ymd(addDays(new Date(), left)) : null;
  const low = Number(m.lowDays)||10;
  const st = left==null ? ["info","Set daily amount"] : left <= 3 ? ["bad","Order now"] : left <= low ? ["warn","Order soon"] : ["ok","Stocked"];
  const rx = m.renewal ? daysBetween(today(), m.renewal) : null;
  return {left, runOut, st, rx};
}

let calView = ls.get("donri.calView","week"), calDate = today();
let outlook = {key:"", items:[], state:"idle"};
function calRange(){ const start = calView==="day" ? parse(calDate) : monday(parse(calDate)); const n = calView==="day" ? 1 : 7; return {start, n, days:[...Array(n)].map((_,i) => ymd(addDays(start,i)))}; }
async function loadOutlook(){
  const {days} = calRange(); const key = days[0] + "|" + days[days.length-1];
  if(outlook.key === key && outlook.state !== "error") return;
  outlook = {key, items:[], state:"loading"};
  try{
    const q = new URLSearchParams({startDateTime:days[0]+"T00:00:00", endDateTime:ymd(addDays(parse(days[days.length-1]),1))+"T00:00:00", $select:"subject,start,end,isAllDay", $orderby:"start/dateTime", $top:"100"});
    const j = await graphJson("/me/calendarView?" + q.toString(), {headers:{Prefer:'outlook.timezone="GMT Standard Time"'}});
    if(outlook.key !== key) return;
    outlook.items = (j.value||[]).map(e => ({title:e.subject, date:e.start.dateTime.slice(0,10), start:e.isAllDay ? "" : e.start.dateTime.slice(11,16)}));
    outlook.state = "ok";
  }catch(e){ outlook.state = "error"; }
  if(sheetRender && $("#sheetTitle") && $("#sheetTitle").textContent === "Family calendar") sheetRender();
}

async function createEvent(d){
  const evId = uid();
  put("events", evId, {title:d.title, date:d.date, start:d.start||"", end:d.end||"", who:d.who||"", note:d.note||"", src:d.src||"", by:myName(), outlook:false});
  log(`added "${d.title}" on ${nice(d.date)}${d.src === "school" ? " (from a school email)" : ""}`);
  if(!d.quiet) notify("calendar", "New family event", `${myName()} added ${d.title}, ${nice(d.date)}${d.start ? " at " + d.start : ""}`, {tags:["calendar"]});
  if(!d.outlook) return {evId, ok:true, att:[], skipped:true};
  const att = adults().filter(m => m.email && m.name !== myName() && (!me || m.email !== me.email)).map(m => ({emailAddress:{address:m.email, name:m.name}, type:"required"}));
  const allDay = !d.start; const s = d.start || "00:00";
  const endT = allDay ? null : (d.end && d.end > s ? d.end : pad(Math.min(23, Number(s.slice(0,2))+1)) + s.slice(2));
  const body = {subject:d.title, body:{contentType:"text", content:(d.who ? "Who: " + d.who + "\n\n" : "") + (d.note ? d.note + "\n\n" : "") + "Added from Donrí"}, isAllDay:allDay,
    start:{dateTime:`${d.date}T${allDay ? "00:00" : s}:00`, timeZone:"GMT Standard Time"},
    end:{dateTime: allDay ? `${ymd(addDays(parse(d.date),1))}T00:00:00` : `${d.date}T${endT}:00`, timeZone:"GMT Standard Time"}, attendees:att};
  try{ const ev = await graphJson("/me/events", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
    patch("events", evId, {outlook:true, outlookId:ev.id}); outlook.key = ""; olToday.at = 0; return {evId, ok:true, att}; }
  catch(err){ return {evId, ok:false, att}; }
}

async function addSuggestion(x, fields, quiet){
  const d = {title:x.title, date:x.date, start:x.start||"", end:x.end||"", who:x.who||"", note:x.note||"", ...(fields||{})};
  const r = await createEvent({...d, src:"school", quiet:true, outlook:fields && "outlook" in fields ? fields.outlook : sugOutlook});
  patch("suggest", x.id, {...d, status:"added", decidedBy:myName(), decidedAt:Date.now(), eventId:r.evId});
  if(!quiet) notify("calendar", "New family event", `${myName()} added ${d.title}, ${nice(d.date)}${d.start ? " at " + d.start : ""} (from a school email)`, {tags:["calendar"]});
  return r;
}

async function grantAccess(itemId, email){
  for(const quiet of [true, false]){
    try{ await graphJson(`/drives/${cfg.d}/items/${itemId}/invite`, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({recipients:[{email}], roles:["write"], requireSignIn:true, sendInvitation:!quiet})}); return {ok:true}; }
    catch(e){ if(e.status === 401) throw e; }
  }
  const j = await graphJson(`/drives/${cfg.d}/items/${itemId}/createLink`, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({type:"edit", scope:"anonymous"})});
  return {ok:true, link:j.link && j.link.webUrl};
}

// Swipe a notification left or right to clear it (one listener for the whole list, so it survives redraws). A tap still works as a tap.
(() => { let el = null, sx = 0, sy = 0, dx = 0, moved = false;
  document.addEventListener("pointerdown", e => { const n = e.target.closest && e.target.closest("#sheet .note"); if(!n || e.target.closest(".note-x")) return; el = n; sx = e.clientX; sy = e.clientY; dx = 0; moved = false; el.style.transition = "none"; });
  document.addEventListener("pointermove", e => { if(!el) return; dx = e.clientX - sx; if(!moved && Math.abs(e.clientY - sy) > 12 && Math.abs(dx) < 12){ el = null; return; } if(Math.abs(dx) > 8) moved = true; if(moved){ el.style.transform = `translateX(${dx}px)`; el.style.opacity = Math.max(.2, 1 - Math.abs(dx) / 260); } });
  const up = () => { if(!el) return; const n = el; el = null;
    if(Math.abs(dx) > 80){ n.style.transition = "transform .18s ease-out, opacity .18s ease-out"; n.style.transform = `translateX(${Math.sign(dx) * window.innerWidth}px)`; n.style.opacity = 0; setTimeout(() => noteClear(n.dataset.note), 190); }
    else { n.style.transition = "transform .15s ease, opacity .15s ease"; n.style.transform = ""; n.style.opacity = ""; } };
  document.addEventListener("pointerup", up); document.addEventListener("pointercancel", up);
  document.addEventListener("click", e => { if(moved && e.target.closest && e.target.closest("#sheet .note")){ e.stopImmediatePropagation(); e.preventDefault(); moved = false; } }, true);
})();

async function loadMe(){
  try{ const j = await graphJson("/me?$select=displayName,mail,userPrincipalName,givenName"); me = {name:j.givenName || (j.displayName||"").split(" ")[0] || "Me", full:j.displayName, email:(j.mail || j.userPrincipalName || "").toLowerCase()}; ls.set("donri.me", me); }catch(e){}
}
async function createFamily(btn){
  btn.disabled = true; btn.textContent = "Setting up…";
  try{
    let folder;
    try{ folder = await graphJson("/me/drive/root:/Donri"); }
    catch(e){ folder = await graphJson("/me/drive/root/children", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({name:"Donri", folder:{}, "@microsoft.graph.conflictBehavior":"fail"})}); }
    let file;
    try{ file = await graphJson("/me/drive/root:/Donri/donri-data.json"); }
    catch(e){
      D = blank(); const t = Date.now();
      D.cols.settings = {family:{members:[{name:me && me.name || "Mark", email:me && me.email || "", topic:"donri-" + rand(22)}, {name:"Helen", email:"", topic:"donri-" + rand(22)}, {name:"Donnacha", email:""}, {name:"Rían", email:""}], u:t}};
      D.cols.setlists = {
        "tesco-weekly":{store:"tesco", name:"Weekly Tesco big shop", items:["2 Milk","Brown bread","Eggs (12)","Butter","Cheddar","Chicken fillets","Bananas","Apples","Potatoes","Yoghurts"].map(s => parseLines(s)[0]), u:t},
        "dunnes-weekly":{store:"dunnes", name:"Weekly Dunnes big shop", items:["Mince","Pasta","2 Tinned tomatoes","Onions","Carrots","Broccoli","Cereal","Toilet roll","Washing-up liquid"].map(s => parseLines(s)[0]), u:t}
      };
      D.cols.rewards = {
        "r-later":{title:"Stay up 15 minutes later", cost:8, icon:"🌙", u:t},
        "r-dinner":{title:"Pick Friday's dinner", cost:10, icon:"🍕", u:t},
        "r-treat":{title:"Treat from the shop", cost:15, icon:"🍦", u:t},
        "r-xbox":{title:"30 minutes extra Xbox", cost:20, icon:"🎮", u:t},
        "r-film":{title:"Film night, you pick", cost:30, icon:"🎬", u:t}
      };
      file = await graphJson("/me/drive/root:/Donri/donri-data.json:/content?@microsoft.graph.conflictBehavior=fail", {method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(D)});
    }
    cfg = {...cfg, d:file.parentReference.driveId, i:file.id, f:folder.id}; ls.set("donri.cfg", cfg);
    etag = null; await sync(true);
    if(me && me.name){ ls.set("donri.who", me.name); }
    render(); toast("Your family space is ready.");
  }catch(e){ btn.disabled = false; btn.textContent = "Create our family space"; toast("Couldn't set up OneDrive (" + (e.code || e.message) + ").", 6000); }
}

    if(!me) await loadMe();
    const rl = ls.get("donri.redeem", []);
    if(rl.length){ const left = []; for(const u of rl){ try{ await graphJson(`/shares/${shareId(u)}/driveItem`, {headers:{Prefer:"redeemSharingLink"}}); }catch(e){ left.push(u); } } if(left.length) ls.set("donri.redeem", left); else ls.del("donri.redeem"); }
    if(cfg.d){ await sync(true);
      if(!myName() && me){ const m = members().find(x => x.email && x.email === me.email); if(m) ls.set("donri.who", m.name); }
      if(me && myName()){ const ms = settings().members || []; const mine = ms.find(x => x.name === myName()); if(mine && mine.invitedAt && !mine.joinedAt){
        put("settings","family",{...settings(), members:ms.map(x => x.name === myName() ? {...x, joinedAt:Date.now()} : x)}); log(`joined Donrí`);
        notify("calendar", "Donrí", `${myName()} has joined Donrí 🎉`, {tags:["tada"], link:"today"}); toast(`Fáilte, ${myName()}! You're in.`, 5000); } }
      render(); }
    else render();
  }
  if(tok && cfg.d && startLink[1]) goLink(startLink.join("/"));
  window.addEventListener("hashchange", () => { const h = location.hash.replace("#",""); if(h && !h.startsWith("join=") && h !== page) goLink(h); });
  if(myName() && cfg.d && !ls.get("donri.introSeen", false)) setTimeout(introPlay, 600);
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
})();
</script>
