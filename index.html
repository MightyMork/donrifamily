<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Donrí</title>
<link rel="manifest" href="app.webmanifest">
<link rel="icon" href="icons/d2-favicon-64.png">
<link rel="apple-touch-icon" href="icons/d2-apple-180.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&family=Andika:wght@400;700&family=Lilita+One&family=Patrick+Hand&family=Press+Start+2P&family=Pixelify+Sans:wght@500;700&family=Baloo+2:wght@700&family=Poppins:wght@500;600;700&family=Open+Sans:wght@400;600&display=swap">
<style>
:root{
  --bg:#FAF8F2; --card:#FFFFFF; --ink:#121B33; --muted:#575E70; --line:#E4E1D6;
  --green:#1F6B3A; --green-soft:#E3F0E6; --blue:#2A4C8C; --blue-soft:#E4EAF6;
  --gold:#A8740E; --gold-soft:#FBF0D6; --fada:#E3B23C; --red:#B3261E; --red-soft:#FBE7E5;
  --accent:#121B33; --on-accent:#FAF8F2; --shadow:0 1px 3px rgba(18,27,51,.08);
}
[data-theme="dark"]{
  --bg:#0C1222; --card:#151D33; --ink:#EEF0F5; --muted:#A6ADBF; --line:#26304A;
  --green:#7FC79A; --green-soft:#17301F; --blue:#9DB8F2; --blue-soft:#1A2644;
  --gold:#F0C25A; --gold-soft:#3A2F14; --red:#F2A39C; --red-soft:#3D1D1A;
  --accent:#E3B23C; --on-accent:#121B33; --shadow:none;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
a,.chip,.check,.kcheck,.pinpad button{touch-action:manipulation}
a{color:var(--blue)}
.app{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;align-items:center;gap:6px}
.brand{display:flex;flex-direction:column;flex:1;min-width:0;gap:3px;background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.word{font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:800;font-size:26px;letter-spacing:-.5px;line-height:1;display:flex;align-items:flex-end}
.word .wm{height:31px;width:auto;display:block;color:var(--ink)}
.wm .dl{fill:#1F6B3A}.wm .ds{stroke:#1F6B3A}
[data-theme="dark"] .wm .dl{fill:#3E9A5C}[data-theme="dark"] .wm .ds{stroke:#3E9A5C}
.stripe{display:flex;width:84px;height:4px;border-radius:2px;overflow:hidden}
.stripe i{flex:1}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;position:relative;flex:none}
.iconbtn svg{width:22px;height:22px}
.notes{display:flex;flex-direction:column;gap:8px}
.note{display:flex;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:14px;touch-action:pan-y;user-select:none}
.note-go{flex:1;text-align:left;background:none;border:0;padding:12px 4px 12px 14px;color:inherit;font:inherit;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.note-go span{font-size:15px}
.note-x{flex:none;width:44px;background:none;border:0;color:var(--muted,#888);font-size:22px;line-height:1;cursor:pointer;border-radius:0 14px 14px 0}
.note-x:hover{color:inherit}
.bt.flash>.card{animation:okflash 1.6s ease}
@keyframes okflash{0%,60%{box-shadow:0 0 0 4px var(--accent,#E3B23C)}100%{box-shadow:none}}
.badge{position:absolute;top:4px;right:4px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 4px}
[data-theme="dark"] .badge{color:#1a0f0e}
.sync{width:10px;height:10px;border-radius:5px;background:var(--green);flex:none}
.sync.busy{background:var(--fada)}
.sync.off{background:var(--red)}
main{padding:14px 12px}
h1{font-family:'Bricolage Grotesque',Inter,sans-serif;font-size:28px;margin:4px 0 12px;letter-spacing:-.5px}
h2{font-size:14px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:22px 0 8px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:10px}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted);font-size:14px}
.small{font-size:13px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],select,textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:10px 12px}
textarea{min-height:120px;resize:vertical}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 4px}
.btn{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--red)}
.btn.sm{min-height:36px;padding:0 10px;font-size:14px}
.btn:disabled{opacity:.5}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{min-height:40px;border-radius:20px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-size:12px;opacity:.8}
.item{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.check{width:30px;height:30px;border-radius:9px;border:2px solid var(--muted);background:transparent;flex:none;display:flex;align-items:center;justify-content:center}
.check.on{background:var(--green);border-color:var(--green);color:var(--bg)}
.check svg{width:18px;height:18px}
.item.done .name{text-decoration:line-through;color:var(--muted)}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.warn{background:var(--gold-soft);color:var(--gold)}
.pill.bad{background:var(--red-soft);color:var(--red)}
.pill.info{background:var(--blue-soft);color:var(--blue)}
.x{width:36px;height:36px;border:0;background:transparent;color:var(--muted);border-radius:10px;flex:none}
.x svg{width:18px;height:18px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
nav.tabs button span{font-size:11px;white-space:nowrap}
nav.tabs button{border:0;background:transparent;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] svg{color:var(--ink)}
nav.tabs button:not([aria-current="page"]) .ac{stroke:currentColor}
.ac{stroke:var(--fada)}
.bi{width:1.25em;height:1.25em;vertical-align:-0.28em;flex:none}
.btn .bi,.chip .bi,.pill .bi{width:1.15em;height:1.15em}
.iconbtn .bi,nav.tabs .bi{width:24px;height:24px;vertical-align:middle}
.btn.primary .ac{stroke:var(--fada)}
.saybtn .bi{width:26px;height:26px;color:var(--blue)}
.remoji .bi{color:var(--blue)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none;align-items:flex-end;justify-content:center}
.scrim.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 14px calc(20px + env(safe-area-inset-bottom))}
.sheet .head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sheet .head h3{flex:1;margin:0;font-family:'Bricolage Grotesque',Inter,sans-serif;font-size:22px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top));z-index:60;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:500;max-width:92vw;box-shadow:0 6px 20px rgba(0,0,0,.25);display:none}
.toast.show{display:block}
.banner{border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px;background:var(--gold-soft);color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--card);min-height:40px;padding:0 14px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.day{border-top:1px solid var(--line);padding:10px 0}
.day:first-child{border-top:0}
.dayh{font-weight:700}
.dayh.today{color:var(--blue)}
.ev{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:12px;background:var(--blue-soft);margin-top:6px}
.ev.ol{background:transparent;border:1px dashed var(--line)}
.ev .t{font-weight:700;font-size:14px;min-width:48px;color:var(--blue)}
.meal{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:0}
.stat{font-family:'Bricolage Grotesque',Inter,sans-serif;font-size:30px;font-weight:800;line-height:1}
.help p,.help li{line-height:1.5}
.empty{text-align:center;color:var(--muted);padding:18px 8px;font-size:14px}
.code{font-family:ui-monospace,monospace;font-size:13px;word-break:break-all;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.welcome{max-width:520px;margin:0 auto;padding:28px 16px}
.toggle{display:flex;align-items:center;gap:10px;min-height:44px}
.toggle input{width:22px;height:22px}
.proto{position:sticky;top:0;z-index:30;background:#2B2B2B;color:#F5F5F5;font-size:13px;height:40px;padding:0 0 0 10px;display:flex;align-items:center;gap:8px;box-sizing:border-box}
.proto b{letter-spacing:1px;font-size:10px;background:#E3B23C;color:#121B33;border-radius:6px;padding:2px 6px}
.proto .pvwho{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#CFCFCF}
.proto .pvwho strong{color:#FFFFFF}
.pvburger{width:52px;height:40px;border:0;background:transparent;color:#F5F5F5;display:flex;align-items:center;justify-content:center;position:relative;flex:none}
.pvburger[aria-expanded="true"]{background:#3A3A3A}
.pvbadge{position:absolute;top:4px;right:8px;min-width:16px;height:16px;border-radius:8px;background:#E3B23C;color:#121B33;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px}
.pvmenu{position:fixed;top:40px;right:6px;z-index:75;width:min(300px,calc(100vw - 12px));background:#2B2B2B;color:#F5F5F5;border-radius:0 0 14px 14px;box-shadow:0 12px 30px rgba(0,0,0,.35);padding:6px;display:flex;flex-direction:column;gap:2px}
.pvmenu button{min-height:44px;border:0;border-radius:10px;background:transparent;color:#F5F5F5;text-align:left;padding:0 12px;font-size:15px;font-weight:600}
.pvmenu button:hover,.pvmenu button:focus-visible{background:#3A3A3A}
.pvmenu .pvdanger{color:#F2A39C}
.pvseg{display:flex;align-items:center;gap:6px;padding:4px 6px 8px;border-bottom:1px solid #444;margin-bottom:4px;font-size:13px;color:#CFCFCF}
.pvseg span{flex:1}
.pvseg button{min-height:40px;min-width:72px;text-align:center;border:1px solid #555;background:#3A3A3A}
.pvseg button[aria-pressed="true"]{background:#F5F5F5;color:#2B2B2B}
header.top{top:var(--protoH,44px)}
.phone{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--protoH,44px) + 8px);z-index:70;width:min(94vw,420px);background:#1F2430;color:#EEF0F5;border-radius:18px;padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.35);display:none}
.phone.show{display:block;cursor:pointer}
.phone .meta{font-size:12px;color:#A6ADBF;display:flex;gap:6px;align-items:center}
.phone .meta i{width:16px;height:16px;border-radius:4px;background:#338574;display:inline-block}
.phone .tt{font-weight:700;margin-top:4px}
.phone .mm{font-size:14px;margin-top:2px}
.hello{font-family:'Bricolage Grotesque',Inter,sans-serif;font-size:28px;font-weight:800;letter-spacing:-.5px;margin:4px 0 0}
.tcard h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:1.1px;color:var(--muted);display:flex;align-items:center;gap:8px}
.tcard h3 .grow{flex:1}
.tcard h3 a,.tcard h3 button{font-size:13px;text-transform:none;letter-spacing:0;font-weight:600;color:var(--blue);background:none;border:0;padding:0;min-height:32px}
.bindot{width:14px;height:14px;border-radius:7px;display:inline-block;border:1px solid rgba(0,0,0,.2);flex:none}
.next{border-left:4px solid var(--fada)}
.starbig{font-family:'Bricolage Grotesque',Inter,sans-serif;font-size:56px;font-weight:800;line-height:1.1}
.kidtxt{font-size:19px;line-height:1.5;letter-spacing:.2px}
.remoji{font-size:34px;line-height:1;flex:none}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--fada);border-radius:6px}
.gain{color:var(--green)}
.starcard{text-align:left;margin:0;flex:1;min-width:0}
.note{background:var(--gold-soft);border-radius:10px;padding:6px 10px;font-size:14px;margin-top:6px;line-height:1.4}
details summary{cursor:pointer;min-height:32px;display:flex;align-items:center}
body.kiosk header.top,body.kiosk nav.tabs{display:none!important}
body.kiosk .app{max-width:1280px;padding-bottom:20px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:start}
.kgrid .card{margin:0;padding:18px}
.kt{font-size:19px;line-height:1.45}
.kt h3{margin:0 0 10px;font-size:15px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);display:flex;align-items:center;gap:8px}
.kt h3 .grow{flex:1}
.ktop{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.kclock{font-family:'Bricolage Grotesque',Inter,sans-serif;font-size:72px;font-weight:800;line-height:.9;letter-spacing:-2px}
.kbig{font-family:'Bricolage Grotesque',Inter,sans-serif;font-size:26px;font-weight:800;line-height:1.2}
.kt .check{width:40px;height:40px;border-radius:12px}
.kt .item{padding:12px 4px}
.kexit{min-height:44px;border-radius:12px;border:1px dashed var(--line);background:transparent;color:var(--muted);padding:0 14px;font-size:14px;user-select:none;-webkit-user-select:none;touch-action:none}
.kexit.holding{background:var(--gold-soft);color:var(--ink)}
.kid{font-size:20px;line-height:1.6;letter-spacing:.02em;word-spacing:.08em;max-width:720px;margin:0 auto}
.kidhi{font-family:'Bricolage Grotesque',Inter,sans-serif;font-size:34px;font-weight:800;line-height:1.15}
.kid h2{font-size:16px;margin:24px 0 10px}
.kidjob{display:flex;align-items:center;gap:14px;padding:16px}
.kcheck{width:58px;height:58px;border-radius:16px;border:3px solid var(--muted);background:var(--card);flex:none;display:flex;align-items:center;justify-content:center;font-size:28px}
.kcheck.on{background:var(--green);border-color:var(--green);color:var(--bg)}
body.nospeech .saybtn{display:none!important}
.saybtn{min-width:48px;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:22px;flex:none}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:10px auto}
.pinpad button{min-height:64px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-size:26px;font-weight:700}
.pindots{text-align:center;font-size:34px;letter-spacing:12px;min-height:44px}
.petscene{position:relative;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;overflow:hidden;border:0;padding-bottom:14px}
.petitem{position:absolute;font-size:36px}
.petbob{animation:petbob 2.8s ease-in-out infinite}
@keyframes petbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.petname{font-family:'Bricolage Grotesque',Inter,sans-serif;font-size:28px;font-weight:800;color:#121B33;background:rgba(255,255,255,.75);border-radius:12px;padding:2px 14px}
.needgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.needbtn{display:flex;flex-direction:column;align-items:center;gap:6px;margin:0;font-size:18px;min-height:120px}
.needbtn:disabled{opacity:.55}
.stage{position:relative;height:300px;border-radius:22px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.45),0 10px 28px rgba(18,27,51,.16)}
.stage .scene{position:absolute;inset:0;width:100%;height:100%}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 10%,rgba(40,60,120,.35),rgba(8,14,36,.72));opacity:0;transition:opacity 1.2s}
.stage.night::after{opacity:1}
.actor{position:absolute;width:150px;height:150px;margin-left:-75px;z-index:2;touch-action:none}
.actor .flipper{transform:scaleX(var(--dir,1));transition:transform .25s}
.actor .pet svg{animation:breathe 3.2s ease-in-out infinite;transform-origin:50% 92%}
@keyframes breathe{50%{transform:scale(1.025,.985)}}
.actor .shadow{position:absolute;left:34px;right:34px;bottom:0;height:14px;border-radius:50%;background:rgba(0,0,0,.2);filter:blur(4px)}
.actor.walking .flipper .pet{animation:walkbob .34s ease-in-out infinite}
@keyframes walkbob{50%{transform:translateY(-7px) rotate(2deg)}}
.actor.excited .flipper .pet{animation:jump .5s ease-out 3}
@keyframes jump{40%{transform:translateY(-36px) scale(1.06)}}
.pet .tail{transform-box:fill-box;transform-origin:0% 50%}
.actor.wag .pet .tail{animation:wag .22s ease-in-out infinite}
@keyframes wag{50%{transform:rotate(-16deg)}}
.pet .ec,.pet .mo,.pet .ml,.pet .my,.pet .brow,.pet .lid{display:none}
.pet.st-ok .mh{display:none}.pet.st-ok .mo{display:inline}
.pet.st-low .mh{display:none}.pet.st-low .ml,.pet.st-low .brow{display:inline}
.pet.st-tired .mh{display:none}.pet.st-tired .mo,.pet.st-tired .lid{display:inline}
.pet.st-sleep .eo,.pet.st-sleep .mh{display:none}.pet.st-sleep .ec,.pet.st-sleep .mo{display:inline}
.pet.st-yawn .eo,.pet.st-yawn .mh{display:none}.pet.st-yawn .ec,.pet.st-yawn .my{display:inline}
.heartp{position:absolute;font-size:24px;pointer-events:none;z-index:4;animation:floatup 1.3s ease-out forwards}
.zz{position:absolute;font:800 22px 'Bricolage Grotesque',sans-serif;color:#fff;pointer-events:none;z-index:4;animation:floatup 2.4s ease-out forwards}
@keyframes floatup{to{transform:translate(var(--hx,20px),-90px) scale(1.3);opacity:0}}
.sbubble{position:absolute;left:50%;top:14px;transform:translateX(-50%);max-width:86%;background:#fff;color:#121B33;border-radius:16px;padding:8px 14px;font-weight:700;font-size:17px;line-height:1.35;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.2);z-index:5;animation:pop .25s ease-out}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}}
.ball{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;z-index:3;touch-action:none;cursor:grab;box-shadow:0 4px 8px rgba(0,0,0,.25)}
.ball-puppy{background:radial-gradient(circle at 34% 30%,#FDFFB8,#D9EF4A 45%,#93B81E)}
.ball-dragon{background:radial-gradient(circle at 34% 30%,#FFC7B8,#F2553D 50%,#B22A17)}

.kd-prog i.now{background:var(--ink);transform:scaleY(1.4)}
.kd h2.kd-h{font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:800;font-size:32px;line-height:1.15;margin:6px 0 4px;text-transform:none;letter-spacing:0;color:var(--ink)}
.kd h2.kd-h.sm{font-size:23px;margin-top:22px}
.kd-lead{font-size:19px;color:var(--muted);margin:0 0 14px}
.kd-small{font-size:16px;color:var(--muted);margin:6px 0 0}
.kd-go{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;margin-top:18px;min-height:64px;border-radius:999px;border:0;background:#121B33;color:#FAF8F2;font:800 22px 'Bricolage Grotesque',Inter,sans-serif;cursor:pointer;box-shadow:0 5px 0 #E3B23C}
.kd-go span{color:#E3B23C;font-size:34px;line-height:0;margin-top:-4px}
[data-theme=dark] .kd-go{background:#E3B23C;color:#121B33;box-shadow:0 5px 0 #8A5F0B}[data-theme=dark] .kd-go span{color:#121B33}
.kd-ghost{display:flex;align-items:center;justify-content:center;width:100%;margin-top:14px;min-height:56px;border-radius:999px;border:2px solid var(--ink);background:transparent;color:var(--ink);font:700 19px Inter,sans-serif;cursor:pointer}
.kd-ghost.sm{width:auto;margin:0;min-height:44px;padding:0 14px;font-size:15px;flex:none}
/* shelf */
.kd-book{display:grid;grid-template-columns:minmax(120px,42%) 1fr;gap:14px;align-items:center;width:100%;text-align:left;padding:10px;border-radius:22px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;margin-bottom:12px;font:inherit;box-shadow:var(--shadow)}
.kd-bcover{position:relative;display:block;border-radius:14px;overflow:hidden;aspect-ratio:16/10;background:#121B33}
.kd-bcover img{width:100%;height:100%;object-fit:cover;display:block}
.kd-btitle{position:absolute;left:8px;top:4px;font-family:'Lilita One',sans-serif;font-size:clamp(20px,6vw,30px);color:#EE7F3B;text-shadow:2px 2px 0 #0F1628;transform:rotate(-3deg)}
.kd-bcover.soon{display:flex;align-items:center;justify-content:center;color:#A6ADBF}.kd-bcover.soon .bi{width:34px;height:34px}
.kd-bmeta{display:flex;flex-direction:column;gap:4px;min-width:0}.kd-bmeta b{font-family:'Bricolage Grotesque',Inter,sans-serif;font-size:24px;line-height:1.1}.kd-bmeta>span{font-size:16px;color:var(--muted)}
.kd-chip{align-self:flex-start;font-size:13px!important;font-weight:700;color:#1F6B3A!important;background:#E3F0E6;border-radius:999px;padding:2px 10px}
.kd-chip.soon{color:#575E70!important;background:#ECEAE3}
.kd-read{display:inline-flex;align-items:center;gap:6px;color:#8A5F0B!important;font-weight:700}.kd-read .bi{width:20px;height:20px}
.kd-read.big{margin-top:12px;font-size:18px}
.kd-book.soon{opacity:.75;cursor:default}
/* cover (shown when the film isn't on screen) */
.kd-cover{position:relative;border-radius:22px;overflow:hidden;margin-top:6px;box-shadow:0 8px 24px rgba(18,27,51,.2)}
.kd-cover img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}
.kd-ctitle{position:absolute;left:4%;top:4%}
.kd-cname{font-family:'Lilita One',sans-serif;font-size:clamp(42px,12vw,84px);line-height:1;color:#EE7F3B;text-shadow:4px 4px 0 #0F1628;transform:rotate(-3deg);transform-origin:left}
.kd-csub{display:inline-block;margin-top:8px;background:#1F2A44;color:#F6ECD6;border:2px solid #E3B23C;padding:2px 12px;font:clamp(16px,3.8vw,24px) 'Patrick Hand',cursive;transform:rotate(-1.5deg)}
.kd-modes{display:grid;gap:12px}
.kd-mode{display:grid;grid-template-columns:44px 1fr;column-gap:12px;text-align:left;align-items:center;padding:14px 16px;border-radius:20px;border:2px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;min-height:76px;font:inherit;box-shadow:4px 4px 0 #E3B23C}
.kd-mode .bi{grid-row:span 2;width:34px;height:34px;justify-self:center}.kd-mode b{font-family:'Bricolage Grotesque',Inter,sans-serif;font-size:22px}.kd-mode span{font-size:16px;color:var(--muted)}
.kd-mode:disabled{opacity:.5;cursor:default;box-shadow:none;border-color:var(--line)}
/* words to meet */
.kd-meet{display:grid;gap:18px;margin-top:10px}
.kd-mcard{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:20px 64px 16px 20px;border-radius:22px;border:2px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;font:inherit;box-shadow:4px 4px 0 #E3B23C}
.kd-mnum{position:absolute;top:-13px;left:16px;width:30px;height:30px;border-radius:50%;background:#121B33;color:#E3B23C;font:800 16px 'Bricolage Grotesque',Inter,sans-serif;display:flex;align-items:center;justify-content:center}
.kd-mword{font-family:'Andika',sans-serif;font-size:54px;line-height:1.2;letter-spacing:.04em}
.kd-hl{color:#1F6B3A;text-decoration:underline;text-decoration-color:#E3B23C;text-decoration-thickness:5px;text-underline-offset:8px}
[data-theme=dark] .kd-hl{color:#7FC79A}
.kd-mtip{font-size:17px;color:var(--muted)}
.kd-mspk{position:absolute;right:18px;top:50%;transform:translateY(-50%)}.kd-mspk .bi{width:30px;height:30px}
.kd-names{display:flex;flex-wrap:wrap;gap:10px}
/* the page */
.kd-pic img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:18px;border:5px solid #FAF8F2;box-shadow:0 0 0 2px var(--line),0 8px 20px rgba(18,27,51,.18)}
.kd-hear{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:14px;min-height:56px;border-radius:999px;border:2px solid var(--ink);background:var(--card);color:var(--ink);font:700 20px Inter,sans-serif;cursor:pointer}
.kd-turn{position:relative;margin-top:26px;background:#FFFDF6;border:3px solid #121B33;border-radius:24px;padding:24px 18px 16px;color:#121B33;box-shadow:5px 5px 0 #E3B23C}
.kd-tab{position:absolute;top:-17px;left:16px;display:flex;align-items:center;gap:6px;background:#121B33;color:#FAF8F2;border-radius:999px;padding:5px 16px 5px 10px;font:800 17px 'Bricolage Grotesque',Inter,sans-serif}.kd-tab .bi{width:20px;height:20px}
.kd-line{font-family:'Andika',sans-serif;font-size:clamp(28px,7.4vw,40px);line-height:1.75;letter-spacing:.04em;word-spacing:.22em;margin:4px 0 12px;color:#121B33}
.kd-w{background:none;border:0;padding:0 3px;margin:0;font:inherit;color:inherit;letter-spacing:inherit;border-radius:10px;cursor:pointer;min-height:auto}
.kd-w.on{background:#F2E28B;color:#121B33;box-shadow:0 0 0 3px #F2E28B}
.kd-name{background:#F2E28B;color:#121B33;border:0;border-radius:12px;padding:0 10px;font:inherit;cursor:pointer;box-shadow:inset 0 -4px 0 #E3B23C}
.kd-name.on{background:#E3B23C;box-shadow:0 0 0 3px #E3B23C}
button.kd-name:not(.kd-w){font-family:'Andika',sans-serif;font-size:23px;padding:8px 16px 10px;min-height:50px}
.kd-with{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:6px 16px;border-radius:999px;border:2px solid #121B33;background:transparent;color:#121B33;font:700 16px Inter,sans-serif;cursor:pointer}.kd-with .bi{width:22px;height:22px}
.kd-nav{display:flex;align-items:center;gap:12px;margin-top:18px}.kd-nav .kd-next{margin:0;flex:1}
/* word hunt */
.kd-stars{display:flex;gap:6px;justify-content:center;margin:2px 0 6px}.kd-stars span{opacity:.22;filter:grayscale(1)}.kd-stars span.on{opacity:1;filter:none;animation:kdPop .4s both}.kd-stars .bi{width:34px;height:34px}
.kd-bigspk{display:flex;align-items:center;justify-content:center;width:112px;height:112px;margin:8px auto 6px;border-radius:50%;border:0;background:#E3B23C;color:#121B33;box-shadow:0 6px 0 #A8740E;cursor:pointer}.kd-bigspk .bi{width:54px;height:54px}
.kd-bigspk:active{transform:translateY(4px);box-shadow:0 2px 0 #A8740E}
.kd-choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-top:16px}
.kd-choice{font-family:'Andika',sans-serif;font-size:42px;padding:16px 10px;border-radius:22px;border:3px solid #121B33;background:#FFFDF6;color:#121B33;cursor:pointer;min-height:96px;box-shadow:4px 4px 0 #2A4C8C;transition:transform .2s}
.kd-choice.kd-yes{background:#1F6B3A;color:#FAF8F2;border-color:#1F6B3A;box-shadow:4px 4px 0 #E3B23C;transform:scale(1.06)}
.kd-wobble{animation:kdWob .45s}@keyframes kdWob{25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
@keyframes kdPop{0%{transform:scale(.3)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.kd-nudge{text-align:center;color:var(--muted);font-size:18px;min-height:28px;margin-top:12px}
/* the end */
.kd-win{position:relative;overflow:hidden;text-align:center;padding:24px 16px 28px;border-radius:26px;background:#121B33;color:#FAF8F2;margin-top:6px}
.kd-win::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:linear-gradient(90deg,#1F6B3A 0 25%,#E3B23C 25% 50%,#F2E28B 50% 75%,#2A4C8C 75%)}
.kd-wstars{display:flex;justify-content:center;gap:10px}.kd-wstars .bi{width:44px;height:44px;animation:kdPop .5s both}.kd-wstars .bi:nth-child(2){animation-delay:.15s;transform:translateY(-8px)}.kd-wstars .bi:nth-child(3){animation-delay:.3s}
.kd-wt{font:800 42px 'Bricolage Grotesque',Inter,sans-serif;margin:8px 0 4px}
.kd-win p{font-size:19px;margin:0;color:#E4E1D6}
.kd-card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px 16px 12px;margin-top:14px}
.kd-card h3{display:flex;align-items:center;gap:8px;font:800 22px 'Bricolage Grotesque',Inter,sans-serif;margin:0 0 6px}.kd-card h3 .bi{width:24px;height:24px}
.kd-card p{font-size:19px;margin:0}
.kd-fact{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:18px}.kd-fact:first-of-type{border-top:0}.kd-fact span{flex:1}
.kd-spk{flex:none;width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}.kd-spk .bi{width:22px;height:22px}

/* ---------- Grown-up reads: the full-screen picture book ---------- */

@keyframes sfStamp{0%{transform:scale(1.9) rotate(var(--r,0deg));opacity:0}55%{transform:scale(.9) rotate(var(--r,0deg));opacity:1}75%{transform:scale(1.05) rotate(var(--r,0deg))}100%{transform:scale(1) rotate(var(--r,0deg));opacity:1}}

/* ==========================================================================
   BENTO LOOK (20 Nov 2026): the grown-ups' app in the Bento UI Kit style.
   One accent (Donrí fada gold) marks the one thing that matters; calm ruled
   surfaces; Poppins headings, Open Sans body. The Púcas look (kid mode, the
   gem pages, Play) and the stories keep their own signed-off styles: their
   rules come after this block and win.
   ========================================================================== */
:root{
  --accent:#E3B23C; --accent-ink:#8A5F0B; --on-accent:#121B33; --soft:#FBF0D6;

  --focus:#2463D1;
  --green:#24704F; --green-soft:#E7F4EC; --red:#B4361C; --red-soft:#FCE9E4;
  --gold:#8A5F0B; --gold-soft:#FBF0D6; --blue:#8A5F0B; --blue-soft:#FBF0D6;
  --shadow:0 1px 2px rgba(31,30,33,.08); --shadow-hover:0 8px 22px rgba(0,0,0,.08);
  --shadow-pop:0 6px 24px rgba(0,0,0,.18); --shadow-modal:0 20px 60px rgba(0,0,0,.3);

}
[data-theme="dark"]{
  --accent:#E3B23C; --accent-ink:#F0C25A; --on-accent:#121B33; --soft:#3A2F14;
  --ink:#ECECEF; --muted:#A4A8B1; --bg:#161618; --surface:#212125; --card:#212125; --line:#36363D;
  --ok:#5CC796; --ok-soft:#18302A; --crit:#F08467; --crit-soft:#3A1F1A; --warn:#F2B45A; --warn-soft:#3A2E14;
  --focus:#7AA7FF;
  --green:#5CC796; --green-soft:#18302A; --red:#F08467; --red-soft:#3A1F1A;
  --gold:#F0C25A; --gold-soft:#3A2F14; --blue:#F0C25A; --blue-soft:#3A2F14; --shadow:none;
}
/* Colours (Settings → Colours): each palette only swaps the accent */
[data-palette="green"]{--accent:#5DBB7E;--accent-ink:#1F6B3A;--soft:#E3F0E6;--blue:#1F6B3A;--blue-soft:#E3F0E6}

[data-theme="dark"][data-palette="primrose"]{--accent:#F2E28B;--accent-ink:#F2E28B;--soft:#35311A;--bg:#161618;--card:#212125;--surface:#212125;--line:#36363D;--blue:#F2E28B;--blue-soft:#35311A}
/* The Púcas screens keep their own colours; give them the new helper names too */
body.pucas,.sheet.pz{--soft:#2E2A1E;--accent-ink:#F2B33D;--surface:#232848;--focus:#7AA7FF;--shadow-pop:0 6px 24px rgba(0,0,0,.4)}
body.pucas{font-family:Inter,system-ui,sans-serif}

/* Base */
html,body{font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--accent-ink)}
h1{font-family:var(--head);font-weight:600;font-size:1.7rem;line-height:1.2;letter-spacing:0;margin:6px 0 14px}
h2{font-family:var(--head);font-weight:600;font-size:1.15rem;line-height:1.2;text-transform:none;letter-spacing:0;color:var(--ink);margin:24px 0 10px}
.muted{color:var(--muted);font-size:.93rem}
.small{font-size:.82rem}

/* Header and tab bar */
header.top{background:var(--surface);border-bottom:1px solid var(--line);gap:8px}
.iconbtn{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);transition:border-color .15s ease,background .15s ease}
.iconbtn:hover{border-color:var(--accent)}
.badge{background:var(--accent);color:#121B33;font-family:var(--head);font-weight:600}
[data-theme="dark"] .badge{color:#121B33}
.sync{background:var(--ok)}
.sync.busy{background:var(--accent)}
.sync.off{background:var(--crit)}
nav.tabs{background:var(--surface);border-top:1px solid var(--line)}
nav.tabs button{position:relative;color:var(--muted);font-family:var(--head);font-weight:500;transition:color .15s ease}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:600}
nav.tabs button[aria-current="page"] svg{color:var(--ink)}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}

/* Panels and cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.tcard h3{font-family:var(--head);font-weight:600;font-size:1rem;text-transform:none;letter-spacing:0;color:var(--ink);margin:0 0 10px}
.tcard h3 a,.tcard h3 button{font-family:var(--body);font-size:.85rem;font-weight:600;color:var(--accent-ink);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.next{border-left:3px solid var(--accent)}
.hello{font-family:var(--head);font-weight:600;font-size:1.7rem;letter-spacing:0;line-height:1.2}
.stat,.starbig,.kbig{font-family:var(--head);font-weight:700}
.stat{font-size:1.4rem}
.empty{color:var(--muted);font-size:.9rem}
.banner{background:var(--warn-soft);color:var(--ink);border-radius:10px;border:1px solid var(--line)}
.note{background:var(--soft);border-radius:8px}
.code{background:var(--bg);border-radius:7px}

/* Buttons */
.btn{min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 16px;font-family:var(--head);font-weight:600;font-size:.93rem;transition:border-color .15s ease,box-shadow .15s ease}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#121B33}
.btn.primary:hover{box-shadow:var(--shadow-hover)}
.btn.primary .ac{stroke:#121B33}
.btn.danger{color:var(--crit)}
.btn.danger:hover{border-color:var(--crit)}
.btn.sm{min-height:36px;padding:0 12px;font-size:.85rem}
.x{border-radius:8px}
.x:hover{background:var(--bg);color:var(--ink)}
.fab{background:var(--accent);color:#121B33;border-radius:16px;box-shadow:var(--shadow-pop)}
.linkish{color:inherit}

/* Chips, segmented control, pills */
.chip{min-height:40px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-family:var(--body);font-weight:600;font-size:.9rem;transition:border-color .15s ease}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--soft);color:var(--ink);border-color:var(--accent)}
.chip .n{font-family:var(--head);font-weight:600;opacity:1;color:var(--muted)}
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--bg);border:1px solid var(--line);border-radius:999px;overflow:visible}
.seg button{background:transparent;border-radius:999px;min-height:38px;padding:0 16px;color:var(--muted);font-family:var(--body);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--soft);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--accent)}
.pill{border-radius:999px;font-family:var(--body);font-weight:600;font-size:.75rem;padding:2px 10px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--crit-soft);color:var(--crit)}
.pill.info{background:var(--bg);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}

/* Lists, ticks, progress */
.item{border-bottom:1px solid var(--line)}
.check{width:30px;height:30px;border-radius:7px;border:2px solid var(--muted);transition:background .15s ease,border-color .15s ease}
.check:hover{border-color:var(--accent)}
.check.on{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.item.done .name{color:var(--muted)}
.bar{height:10px;background:var(--bg);border:1px solid var(--line);border-radius:999px}
.bar i{background:var(--accent);border-radius:999px}
.gain{color:var(--ok)}

/* Forms */
label.f{font-size:.88rem;font-weight:600;color:var(--ink)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],input[type=password],input[type=search],select,textarea{border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);padding:9px 11px;transition:border-color .15s ease,box-shadow .15s ease}
input[type=text]:focus,input[type=number]:focus,input[type=date]:focus,input[type=time]:focus,input[type=email]:focus,input[type=password]:focus,input[type=search]:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.toggle input{accent-color:var(--accent)}

/* Calendar and meals */
.day{border-top:1px solid var(--line)}
.dayh{font-family:var(--head);font-weight:600}
.dayh.today{color:var(--accent-ink)}
.ev{background:var(--bg);border:1px solid var(--line);border-radius:8px}
.ev.next{border-left:3px solid var(--accent)}
.ev.ol{background:transparent;border:1px dashed var(--line)}
.ev .t{color:var(--ink);font-family:var(--head);font-weight:600}
.meal{border-bottom:1px solid var(--line)}

/* Bottom sheets, toast, palette picker */
.scrim{background:rgba(20,20,24,.45)}
.sheet{background:var(--bg);border-radius:16px 16px 0 0;box-shadow:var(--shadow-modal)}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 10px}
.sheet .head h3{font-family:var(--head);font-weight:600;font-size:1.25rem;letter-spacing:0}
.toast{top:auto;bottom:calc(150px + env(safe-area-inset-bottom));background:var(--surface);color:var(--ink);border:1.5px solid var(--accent);border-radius:10px;box-shadow:var(--shadow-pop);font-weight:600}
.toast.show{animation:bnToast .2s ease-out}
@keyframes bnToast{from{opacity:0;transform:translate(-50%,8px)}}
.scrim.open ~ .toast{bottom:auto;top:calc(var(--protoH,44px) + 12px + env(safe-area-inset-top))}
.palbtn{border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
.palbtn[aria-checked="true"]{border-color:var(--accent);background:var(--soft)}
.kexit{border-radius:8px}
.kexit.holding{background:var(--soft)}
.saybtn{border-radius:8px;background:var(--surface)}
.saybtn .bi{color:var(--accent-ink)}
.remoji .bi{color:var(--accent-ink)}
.qbtn{border-radius:14px}
.qbtn:hover{border-color:var(--accent);box-shadow:var(--shadow-hover)}
.acard{border-radius:10px;background:var(--surface)}

/* Kitchen display: big clock, calm cards */
.kclock{font-family:var(--head);font-weight:700;letter-spacing:-1px}
.kt h3{font-family:var(--head);font-weight:600;font-size:1.05rem;text-transform:none;letter-spacing:0;color:var(--ink)}
.kt .check{border-radius:8px}

/* ---------- Today as a bento grid ---------- */
.bento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;grid-auto-flow:row dense}
.bento>.bt{min-width:0;display:flex;animation:bnIn .6s cubic-bezier(.2,.7,.2,1) both}
.bento>.bt.w{grid-column:1/-1}
.bento>.bt>.card{flex:1;margin:0;border-radius:14px;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
.bento>.bt>.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);border-color:var(--accent)}
.bento>.bt:nth-child(2){animation-delay:.04s}.bento>.bt:nth-child(3){animation-delay:.08s}.bento>.bt:nth-child(4){animation-delay:.12s}.bento>.bt:nth-child(n+5){animation-delay:.16s}
@keyframes bnIn{from{opacity:0;transform:translateY(8px)}}
.bento .bt:not(.w) .tcard h3{flex-wrap:wrap;row-gap:0}
.bento .bt:not(.w) .chip{min-height:36px;padding:0 10px}
.bento .bt:not(.w) .btn{max-width:100%;white-space:normal;text-align:center}
.bstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 12px}
.bstat{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);color:var(--ink);font:inherit;min-height:84px;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
.bstat:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);border-color:var(--accent)}
.bstat .bi{width:22px;height:22px;padding:6px;box-sizing:content-box;border-radius:8px;background:var(--soft);color:var(--accent-ink)}
.bstat .bi .ac{stroke:var(--accent-ink)}
.bstat b{font-family:var(--head);font-weight:700;font-size:1.4rem;line-height:1.1;margin-top:4px}
.bstat span{font-size:.78rem;color:var(--muted);line-height:1.25}
.bstat.hot{background:var(--soft);border-color:var(--accent)}
.homeedit{display:flex;justify-content:center;margin-top:14px}
@media (prefers-reduced-motion:reduce){.bento>.bt,.toast.show{animation:none}.bento>.bt>.card:hover,.bstat:hover{transform:none}}
#phone,#toast{touch-action:none;user-select:none;-webkit-user-select:none}
/* v18: no visible scroll bars anywhere (scrolling still works) */
html,body,*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
/* v18: kitchen display tiles you can move and resize */
.kgrid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));grid-auto-flow:row dense}
.kgrid>.kt.kw{grid-column:span 2}
.kgrid>.kt.kf{grid-column:1/-1}
@media (max-width:660px){.kgrid>.kt.kw{grid-column:1/-1}}
.kgrid>.kt.kw .klist,.kgrid>.kt.kf .klist{columns:2;column-gap:24px}
.kgrid>.kt.kf .klist{columns:3}
.klist>*{break-inside:avoid}
.kt.kbigtxt{font-size:23px}.kt.kbigtxt .kbig{font-size:32px}
.karr{position:relative;outline:2px dashed var(--accent);outline-offset:3px}
.kedit{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.kedit button{min-height:44px;min-width:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:15px;padding:0 10px}
.kedit button[aria-pressed=true]{background:var(--accent);color:var(--on-accent,#fff);border-color:var(--accent)}
.kt.khid{opacity:.45}
.kfoot{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;align-items:center;margin-top:16px}
.kfoot .kbtn{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 14px;font:inherit;font-size:15px}
/* v18: Settings sections fold away */
details.sset{margin:10px 0;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
details.sset>summary{list-style:none;font-family:var(--head);font-weight:600;font-size:1.05rem;padding:12px 14px;min-height:52px;gap:10px}
details.sset>summary::-webkit-details-marker{display:none}
details.sset>summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s}
details.sset[open]>summary::after{transform:rotate(-135deg)}
details.sset>.sbody{padding:0 12px 12px}
details.sset>.sbody>.card:first-child{margin-top:0}
/* v18: swipe between photos */
.pview{position:relative;touch-action:pan-y}
.pview img{width:100%;border-radius:14px;display:block;user-select:none;-webkit-user-drag:none}
.pnav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:22px;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:24px;line-height:1}
.pnav.l{left:8px}.pnav.r{right:8px}
.pcount{text-align:center;margin-top:6px}
.kidtogether{width:100%;min-height:52px;font-size:18px;margin-top:4px}
/* ---------- end BENTO LOOK ---------- */

/* ---------- PÚCAS THEME: everything the boys see, in the painted-pixel look of Wild Éire ---------- */
body.pucas{
  --bg:#171A33;--card:#232848;--ink:#F4E6C8;--muted:#B9B4CC;--line:#3B4070;--accent:#F2B33D;--on-accent:#171A33;--blue:#5FD0C0;--fada:#F2B33D;--green:#5FAE5B;--gold-soft:#4A3F2A;
  --pxc:polygon(0 6px,3px 6px,3px 3px,6px 3px,6px 0,calc(100% - 6px) 0,calc(100% - 6px) 3px,calc(100% - 3px) 3px,calc(100% - 3px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 3px) calc(100% - 6px),calc(100% - 3px) calc(100% - 3px),calc(100% - 6px) calc(100% - 3px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 3px),3px calc(100% - 3px),3px calc(100% - 6px),0 calc(100% - 6px));
  background:radial-gradient(1px 1px at 12% 8%,#F4E6C8 50%,transparent 51%) 0 0/220px 260px,radial-gradient(1.5px 1.5px at 68% 22%,#F2E28B 50%,transparent 51%) 0 0/300px 340px,linear-gradient(180deg,#1C2045 0%,#2A2552 55%,#3B2A4C 100%) fixed;
  color:var(--ink)}
body.pucas .kid,body.pucas .kd{color:var(--ink)}
body.pucas .kid .card{border-radius:0;clip-path:var(--pxc);background:var(--card);border:3px solid #10122A;box-shadow:inset 0 0 0 2px #3B4070}
body.pucas .kid h2{font-family:'Pixelify Sans','Bricolage Grotesque',sans-serif;font-weight:700;font-size:23px;letter-spacing:.02em;text-transform:none;color:#F2B33D;margin:26px 0 10px}
body.pucas .kidhi{font-family:'Pixelify Sans','Bricolage Grotesque',sans-serif;font-weight:700}
body.pucas .muted{color:var(--muted)}
body.pucas .saybtn{border-radius:0;clip-path:var(--pxc);background:#2E3460;border:2px solid #4A5190;color:var(--ink)}
body.pucas .saybtn .bi{color:#5FD0C0}
body.pucas .btn{border-radius:0;clip-path:var(--pxc);font-family:'Pixelify Sans',Inter,sans-serif;font-weight:700;background:#2E3460;color:var(--ink);border:2px solid #4A5190}
body.pucas .btn.primary{background:#F2B33D;color:#171A33;border-color:#F2B33D;box-shadow:inset 0 -5px 0 #B5862A}
body.pucas .pill{border-radius:0;clip-path:var(--pxc)}
body.pucas .bar{height:16px;border-radius:0;background:#10122A;border:2px solid #3B4070}
body.pucas .bar i{border-radius:0;background:repeating-linear-gradient(90deg,#F2B33D 0 10px,#D99A22 10px 12px)}
body.pucas .gain{color:#7FD38A}
/* the scene at the top of his page */
.pk-hero{position:relative;height:210px;margin:-4px 0 0;border:3px solid #10122A;clip-path:var(--pxc,none);background-size:cover;background-position:center 62%;image-rendering:pixelated;display:flex;flex-direction:column;justify-content:space-between;padding:12px 14px}
.pk-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,18,42,.55) 0%,rgba(16,18,42,0) 40%,rgba(16,18,42,0) 55%,rgba(16,18,42,.75) 100%);pointer-events:none}
.pk-top{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:10px}
.pk-date{font-family:'Pixelify Sans',Inter,sans-serif;font-weight:500;font-size:18px;color:#F4E6C8;background:rgba(16,18,42,.6);padding:4px 10px}
.pk-hi{position:relative;z-index:1;font-size:36px!important;line-height:1.05;color:#FFF6DE;text-shadow:3px 3px 0 #10122A}
body.pucas .kexit{border-radius:0;border:2px dashed rgba(244,230,200,.5);background:rgba(16,18,42,.55);color:#F4E6C8}
/* gems with Dabbit */
.pk-stars{display:flex;align-items:center;gap:12px;margin-top:14px;text-align:left}
.pk-buddy{width:92px;height:92px;object-fit:contain;flex:none;image-rendering:pixelated;animation:pkBob 2.4s ease-in-out infinite}
.pk-buddy.pk-hop{animation:pkHop 1s ease-in-out infinite}
.pk-stars .starbig{font-family:'Pixelify Sans','Bricolage Grotesque',sans-serif;font-size:48px}
.pk-msg{font-size:19px}
.pk-none{display:flex;align-items:center;gap:12px;font-size:21px}.pk-none img{width:72px;height:72px;image-rendering:pixelated;animation:pkHop 1s ease-in-out infinite}
@keyframes pkBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes pkHop{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}}
body.pucas .kcheck{border-radius:0;clip-path:var(--pxc);border:4px solid #F2B33D;background:#10122A}
body.pucas .kcheck.on{background:#5FAE5B;border-color:#5FAE5B;color:#10122A}
/* Story time in the same world: dark pixel panels; the reading card stays cream so the words are easy to read */
body.pucas .kd-round,body.pucas .kd-ghost,body.pucas .kd-hear,body.pucas .kd-mode,body.pucas .kd-book,body.pucas .kd-card,body.pucas .kd-choice,body.pucas .kd-go,body.pucas .kd-win,body.pucas .kd-tab,body.pucas .kd-pic img,body.pucas .kd-cover,body.pucas .kd-bcover{border-radius:0;clip-path:var(--pxc)}
body.pucas .kd-htitle b,body.pucas .kd h2.kd-h,body.pucas .kd-bmeta b,body.pucas .kd-mode b,body.pucas .kd-card h3,body.pucas .kd-wt{font-family:'Pixelify Sans','Bricolage Grotesque',sans-serif;font-weight:700}
body.pucas .kd h2.kd-h{color:#F2B33D}
body.pucas .kd-go{background:#F2B33D;color:#171A33;box-shadow:inset 0 -6px 0 #B5862A;font-family:'Pixelify Sans','Bricolage Grotesque',sans-serif}
body.pucas .kd-go span{color:#171A33}
body.pucas .kd-mcard,body.pucas .kd-mode{box-shadow:none;border:3px solid #4A5190;background:#232848;border-radius:0}
body.pucas .kd-mnum{border-radius:0;background:#F2B33D;color:#171A33}
body.pucas .kd-hl{color:#7FD38A}
body.pucas .kd-turn{box-shadow:none;border:4px solid #F2B33D;border-radius:0}
body.pucas .kd-tab{clip-path:none;border-radius:0;background:#F2B33D;color:#171A33}
body.pucas .kd-choice{box-shadow:inset 0 -6px 0 #C9BFA3;border-color:#F2B33D}
body.pucas .kd-choice.kd-yes{background:#5FAE5B;border-color:#5FAE5B;box-shadow:inset 0 -6px 0 #3E7E3B}
body.pucas .kd-win{background:#10122A;border:3px solid #F2B33D}
body.pucas .kd-chip{border-radius:0;background:#2F5A3A;color:#BFF0C6!important}
body.pucas .kd-read{color:#F2B33D!important}
body.pucas .kd-prog i{border-radius:0;background:#3B4070}
body.pucas .kd-prog i.now{background:#F4E6C8}
.kd-buddy{display:block;width:120px;height:120px;object-fit:contain;margin:0 auto -6px;image-rendering:pixelated;animation:pkBob 2.4s ease-in-out infinite}
.kd-buddy.yay{animation:pkHop .8s ease-in-out infinite}
/* Play: the cartridge console sits in the same sky */
body.pucas .arc{background:linear-gradient(180deg,rgba(23,26,51,.25),rgba(23,26,51,.9) 46%),url(pucas/scene-dabbit.jpg) center top/cover;border:3px solid #10122A;border-radius:0;clip-path:var(--pxc)}
.arc-buddy{position:absolute;right:10px;bottom:118px;width:84px;height:84px;image-rendering:pixelated;pointer-events:none;animation:pkBob 2.4s ease-in-out infinite;z-index:1}
.arc-logo,.arc-title{font-family:'Pixelify Sans','Bricolage Grotesque',sans-serif!important}

// Swipe a pop-up away (left, right or up). A tap still works as a tap.
function swipeAway(el, onGone){
  let sx = 0, sy = 0, dx = 0, dy = 0, on = false, moved = false;
  const put = (x, y, o) => { el.style.transform = `translate(calc(-50% + ${x}px), ${y}px)`; el.style.opacity = o; };
  const reset = () => { el.style.transition = ""; el.style.transform = ""; el.style.opacity = ""; };
  el.addEventListener("pointerdown", e => { on = true; moved = false; sx = e.clientX; sy = e.clientY; dx = dy = 0; el.style.transition = "none"; try{ el.setPointerCapture(e.pointerId); }catch(_){} });
  el.addEventListener("pointermove", e => { if(!on) return; dx = e.clientX - sx; dy = Math.min(0, e.clientY - sy); if(Math.abs(dx) > 8 || dy < -8) moved = true; if(moved) put(dx, dy, Math.max(.2, 1 - Math.max(Math.abs(dx), -dy * 2) / 260)); });
  const up = () => { if(!on) return; on = false;
    if(Math.abs(dx) > 70 || dy < -36){ el.style.transition = "transform .18s ease-out, opacity .18s ease-out"; put(Math.abs(dx) > 70 ? Math.sign(dx) * window.innerWidth : dx, Math.abs(dx) > 70 ? dy : -160, 0);
      setTimeout(() => { reset(); onGone(); }, 190); }
    else { el.style.transition = "transform .15s ease"; el.style.transform = ""; el.style.opacity = ""; setTimeout(reset, 160); } };
  el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
  el.addEventListener("click", e => { if(moved){ e.stopImmediatePropagation(); e.preventDefault(); moved = false; } }, true);
}

const AUTH = "https://login.microsoftonline.com/consumers/oauth2/v2.0";

const SCOPES = "openid profile offline_access User.Read Files.ReadWrite.All Calendars.ReadWrite";

async function signIn(silent){
  if(!cfg.c){ toast("Add the Client ID first."); return; }
  const verifier = rand(64);
  const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  const state = rand(16);
  ss.set("donri.pkce", JSON.stringify({verifier, state}));
  const q = new URLSearchParams({client_id:cfg.c, response_type:"code", redirect_uri:REDIRECT, scope:SCOPES, state, code_challenge:challenge, code_challenge_method:"S256", response_mode:"query"});
  if(silent) q.set("prompt","none");
  location.assign(AUTH + "/authorize?" + q.toString());
}
async function tokenRequest(params){
  const r = await fetch(AUTH + "/token", {method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"}, body:new URLSearchParams({client_id:cfg.c, scope:SCOPES, ...params})});
  const j = await r.json().catch(() => ({}));
  if(!r.ok || !j.access_token) throw Object.assign(new Error(j.error_description || "token"), {code:j.error || "token_error"});
  tok = {at:j.access_token, rt:j.refresh_token || (tok && tok.rt), exp:Date.now() + (j.expires_in||3600)*1000};
  ls.set("donri.tok", tok);
  return tok.at;
}
async function handleRedirect(){
  const q = new URLSearchParams(location.search);
  if(!q.has("code") && !q.has("error")) return;
  const saved = JSON.parse(ss.get("donri.pkce") || "null"); ss.del("donri.pkce");
  history.replaceState(null, "", REDIRECT + location.hash);
  if(q.has("error")){ if(q.get("error") !== "login_required" && q.get("error") !== "interaction_required") toast("Sign-in didn't finish: " + (q.get("error_description")||q.get("error")).slice(0,140), 6000); return; }
  if(!saved || saved.state !== q.get("state")){ toast("Sign-in expired, please try again."); return; }
  try{ await tokenRequest({grant_type:"authorization_code", code:q.get("code"), redirect_uri:REDIRECT, code_verifier:saved.verifier}); ss.del("donri.silent"); }

async function accessToken(){
  if(tok && tok.at && tok.exp - Date.now() > 90000) return tok.at;
  if(!tok || !tok.rt) throw Object.assign(new Error("signed out"), {code:"signed_out"});
  if(!refreshing) refreshing = tokenRequest({grant_type:"refresh_token", refresh_token:tok.rt}).finally(() => refreshing = null);

// The private file: found (or made, the first time something is marked "Just me") in your own OneDrive
const PRIVATE_PATH = "/me/drive/root:/Donri/donri-private.json";
async function readPrivate(meta){ const r = await fetch(meta["@microsoft.graph.downloadUrl"], {cache:"no-store"}); if(!r.ok) throw new Error("private download " + r.status); return r.json(); }
async function syncPrivate(force){
  if(!pItem){
    try{ const m = await graphJson(PRIVATE_PATH); pItem = m.id; }
    catch(e){
      if(e.status !== 404) throw e;
      if(!pdirty) return false; // nothing private yet, so no file needed
      const m = await graphJson(PRIVATE_PATH + ":/content?@microsoft.graph.conflictBehavior=fail", {method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(P || blank())});
      pItem = m.id; petag = m.eTag; pdirty = false; persist(); return true;
    }
  }
  let meta;
  try{ meta = await graphJson(`/me/drive/items/${pItem}`); }
  catch(e){ if(e.status === 404){ pItem = null; petag = null; persist(); return syncPrivate(force); } throw e; }
  let got = false;
  if(force || meta.eTag !== petag){ const remote = await readPrivate(meta); P = merge(P || blank(), remote); petag = meta.eTag; pdirty = aheadOf(P, remote); got = true; }
  for(let attempt = 0; attempt < 4 && pdirty; attempt++){
    const cut = Date.now() - 30*86400000;
    for(const col of Object.keys(P.cols)) for(const [id,x] of Object.entries(P.cols[col])) if(x._del && (x.u||0) < cut) delete P.cols[col][id];
    const r = await graph(`/me/drive/items/${pItem}/content`, {method:"PUT", headers:{"Content-Type":"application/json", ...(petag ? {"If-Match":petag} : {})}, body:JSON.stringify(P)});
    if(r.status === 412 || r.status === 409){ const m2 = await graphJson(`/me/drive/items/${pItem}`); P = merge(P, await readPrivate(m2)); petag = m2.eTag; continue; }
    if(!r.ok) throw new Error("private upload " + r.status);
    const j = await r.json(); petag = j.eTag; pdirty = false;
  }
  persist(); return got;
}
function sync(force){
  if(!cfg.d || !tok) return Promise.resolve();
  return exclusive(async () => {
    setSync("busy");
    try{ const got = await pull(force); if(dirty) await push();
      let pgot = false; try{ pgot = await syncPrivate(force); }catch(pe){ if(pe.code === "signed_out") throw pe; toast("Couldn't reach your private (Just me) file. It'll try again shortly.", 5000); }
      lastSyncErr = null; setSync("ok"); if(got || pgot) { render(); } if(got) sendOutbox(); ensurePhotoFolder(); if(myName()) checkRenewalReminders(); }
    catch(e){ lastSyncErr = e; setSync("off"); if(e.code === "signed_out"){ render(); } else if(e.status === 404 || e.status === 403){ toast("Can't reach the family file. Check it's still shared with you.", 6000); } }
  });
}

function scheduleSave(){ clearTimeout(saveT); saveT = setTimeout(() => sync(false), 700); }

// Things other people did since we last looked
function noticeIncoming(before, after){
  if(!before) return;
  const msgs = [];
  for(const [id,x] of Object.entries((after.cols.shop)||{})){
    const old = before.cols.shop && before.cols.shop[id];
    if(!x._del && x.done && !(old && old.done) && x.doneBy && x.doneBy !== myName()) msgs.push(`${x.doneBy} picked up ${x.name}`);
  }
  for(const [id,x] of Object.entries((after.cols.events)||{})){
    if(!x._del && !(before.cols.events && before.cols.events[id]) && x.by && x.by !== myName()) msgs.push(`${x.by} added ${x.title}`);
  }
  if(msgs.length) toast(msgs.slice(0,2).join(" · ") + (msgs.length > 2 ? ` +${msgs.length-2} more` : ""), 5000);
}

async function ntfy(topic, title, message, tags, link){
  const m = members().find(x => x.topic === topic); if(m) put("inbox", uid(), {to:m.name, title, message, link:link||"today", at:Date.now()}); // Donrí's own notifications list (bell)

// Today's events from your own Outlook (shown dashed, only to you)
let olToday = {date:"", items:[], state:"idle", at:0};
async function loadTodayOutlook(){
  const t = today();
  if(olToday.date === t && (olToday.state === "loading" || Date.now() - olToday.at < (olToday.state === "ok" ? 600000 : 60000))) return;
  olToday = {date:t, items:olToday.date === t ? olToday.items : [], state:"loading", at:Date.now()};
  try{
    const q = new URLSearchParams({startDateTime:t+"T00:00:00", endDateTime:ymd(addDays(parse(t),2))+"T00:00:00", $select:"subject,start,end,isAllDay", $orderby:"start/dateTime", $top:"50"});
    const j = await graphJson("/me/calendarView?" + q.toString(), {headers:{Prefer:'outlook.timezone="GMT Standard Time"'}});
    if(olToday.date !== t) return;
    olToday.items = (j.value||[]).map(e => ({title:e.subject, date:e.start.dateTime.slice(0,10), start:e.isAllDay ? "" : e.start.dateTime.slice(11,16)}));
    olToday.state = "ok";
  }catch(e){ olToday.state = "error"; }
  olToday.at = Date.now();
  if(page === "today") render();
}
const BIN_COLOURS = {black:"#2B2B2B", green:"#2E8B57", brown:"#8B5A2B", blue:"#2A6CC9", purple:"#7B4FB3", grey:"#9AA0A6"};
const DOW = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function binsOn(dateStr){
  const b = doc("settings","bins"); if(!b || !b.anchor) return [];
  const d = parse(dateStr); if(d.getDay() !== parse(b.anchor).getDay()) return [];
  const weeks = Math.round(daysBetween(b.anchor, dateStr) / 7);
  return (b.streams||[]).filter(s => { const ev = Number(s.every)||1; return ((weeks - (Number(s.offset)||0)) % ev + ev) % ev === 0; });
}
function binCard(){

  const now = new Date(), t = today(), tm = ymd(addDays(now,1));

function binsNextHas(b, s){ if(!b.anchor) return false; for(let i = 0; i <= 7; i++){ const d = ymd(addDays(new Date(), i)); if(parse(d).getDay() === parse(b.anchor).getDay()) return binsOn(d).some(x => x.name === s.name); } return false; }

let choreFilter = "due";
const FREQ = {daily:1, weekly:7, fortnightly:14, monthly:30, once:0};
function choreDue(c){ if(!c.lastDone) return true; if(c.freq === "once") return false; return daysBetween(c.lastDone, today()) >= (FREQ[c.freq]||7); }
let choreWho = "";
const assignees = c => Array.isArray(c.assignees) ? c.assignees : (c.who ? [c.who] : []);
const turnOf = c => { const a = assignees(c); return c.rotate && a.length > 1 ? (a.includes(c.turn) ? c.turn : a[0]) : ""; };
const isFor = (c, n) => { const a = assignees(c); if(!a.length) return true; return c.rotate && a.length > 1 ? turnOf(c) === n : a.includes(n); };
function whoLine(c){
  const a = assignees(c);
  if(!a.length) return "Anyone";
  if(c.rotate && a.length > 1) return `${turnOf(c)}'s turn · takes turns: ${a.join(", ")}`;
  return a.join(", ");
}
// ---------- GEMS (points and rewards for the boys) ----------
// The boys are the family members without notifications. Gems are a running list of +/- entries, so two phones never overwrite each other.
const kids = () => members().filter(m => !m.topic);
const isKid = n => kids().some(k => k.name === n);
const stars = n => docs("points").filter(p => p.kid === n).reduce((s,p) => s + (Number(p.amount)||0), 0);
const pendTeam = c => (c.pendingTeam && c.pendingTeam.length ? c.pendingTeam : (c.pendingBy ? [c.pendingBy] : []));
const byIncludes = (by, n) => String(by||"").split(" & ").includes(n);
const choreKids = c => { const a = assignees(c).filter(isKid); if(c.rotate && assignees(c).length > 1) return isKid(turnOf(c)) ? [turnOf(c)] : []; return a; };
const REWARD_ICONS = ["🎮","🍦","🍫","🍕","🌙","🎬","⚽","📚","🎨","🎁"];
function awardStars(c, kid){
  const pts = Number(c.points)||0; if(!pts || !kid) return;
  put("points", uid(), {kid, amount:pts, reason:c.title, choreId:c.id, date:today(), by:myName(), at:Date.now()});
  log(`gave ${kid} ${pts} ⭐ for ${c.title}`);
  toast(`⭐ +${pts} for ${kid}! That's ${stars(kid)} gems.`);
}
function awardStarsMany(c, names){
  const pts = Number(c.points)||0; names = (names||[]).filter(Boolean); if(!pts || !names.length) return;
  if(names.length === 1) return awardStars(c, names[0]);
  names.forEach(kid => put("points", uid(), {kid, amount:pts, reason:c.title, choreId:c.id, joint:true, date:today(), by:myName(), at:Date.now()}));
  log(`gave ${names.join(" and ")} ${pts} ⭐ each for ${c.title}`);
  toast(`⭐ +${pts} each for ${names.join(" and ")}! Great teamwork.`);
}

const SNACK_TREAT = {puppy:"🦴", axolotl:"🪱", dragon:"🦗"};
const G = 900, STEP = 1/120;
function makeSnackWorld(L){
  const candy = {x:L.candy[0], y:L.candy[1], px:L.candy[0], py:L.candy[1], w:0.35, bubble:null};
  const ropes = L.ropes.map(([ax, ay, len]) => {
    const n = Math.max(6, Math.round(len / 18)); const pts = [];
    for(let i = 0; i < n; i++){ const t = i / n; const x = ax + (candy.x - ax) * t, y = ay + (candy.y - ay) * t; pts.push({x, y, px:x, py:y, w:i === 0 ? 0 : 1}); }
    pts.push(candy); return {pts, seg:len / n, cut:-1};
  });
  return {L, candy, ropes, bubbles:(L.bubbles || []).map(([x,y]) => ({x, y, r:30, alive:true})), pads:L.pads || [], fans:(L.fans || []).map(([x,y]) => ({x, y, on:false, band:170})),
    sparkles:(L.sparkles || []).map(([x,y]) => ({x, y, got:false})), won:false, lost:false, t:0, got:0};
}
function snackStep(W){
  W.t += STEP; const c = W.candy;
  const pts = new Set(); W.ropes.forEach(r => r.pts.forEach(p => pts.add(p)));
  pts.add(c);
  for(const p of pts){ if(!p.w) continue;
    const damp = p === c ? 0.9975 : 0.99; let vx = (p.x - p.px) * damp, vy = (p.y - p.py) * damp;
    let ay = G;
    if(p === c && c.bubble){ vx *= 0.985; vy = vy * 0.9 - 0.06; ay = 0; }
    p.px = p.x; p.py = p.y; p.x += vx; p.y += vy + ay * STEP * STEP;
  }
  for(let it = 0; it < 12; it++) for(const r of W.ropes){
    for(let i = 0; i < r.pts.length - 1; i++){ if(r.cut >= 0 && i >= r.cut) continue; // the cut-off bottom piece falls away
      const a = r.pts[i], b = r.pts[i+1]; const dx = b.x - a.x, dy = b.y - a.y; const d = Math.hypot(dx, dy) || 0.0001; const diff = (d - r.seg) / d;
      if(diff < 0 && b === c) continue; // ropes don't push the treat, only pull
      const wa = a.w, wb = b.w, s = wa + wb; if(!s) continue;
      a.x += dx * diff * wa / s; a.y += dy * diff * wa / s; b.x -= dx * diff * wb / s; b.y -= dy * diff * wb / s;
    }
  }
  // bubble capture
  for(const bu of W.bubbles){ if(bu.alive && !c.bubble && Math.hypot(c.x - bu.x, c.y - bu.y) < bu.r + 4){ c.bubble = bu; c.px = c.x - (c.x - c.px) * 0.2; c.py = c.y; } }
  if(c.bubble){ c.bubble.x = c.x; c.bubble.y = c.y; }
  // trampolines
  for(const [x1,y1,x2,y2] of W.pads){
    const ex = x2 - x1, ey = y2 - y1, len = Math.hypot(ex, ey); let nx = ey / len, ny = -ex / len; if(ny > 0){ nx = -nx; ny = -ny; }
    const t = ((c.x - x1) * ex + (c.y - y1) * ey) / (len * len); if(t < -0.05 || t > 1.05) continue;
    const dist = (c.x - x1) * nx + (c.y - y1) * ny; const vx = c.x - c.px, vy = c.y - c.py; const vn = vx * nx + vy * ny;
    if(dist < 10 && dist > -18 && vn < 0){ const e = 1.0; const rvx = vx - (1 + e) * vn * nx, rvy = vy - (1 + e) * vn * ny; c.x += (10 - dist) * nx; c.y += (10 - dist) * ny; c.px = c.x - rvx; c.py = c.y - rvy; W.bounced = (W.bounced || 0) + 1; }
  }
  // a fan that's switched on blows steadily to the right across its band
  for(const f of W.fans){ if(!f.on) continue; if(c.y > f.y - f.band && c.y < f.y + f.band && c.x > f.x){ c.px -= c.bubble ? (W.L.windBubble || 0.01) : (W.L.wind || 0.03); } }
  for(const s of W.sparkles){ if(!s.got && Math.hypot(c.x - s.x, c.y - s.y) < 24){ s.got = true; W.got++; W.sparkled = true; } }
  const [gx, gy] = W.L.goal; if(Math.hypot(c.x - gx, c.y - gy) < 46) W.won = true;
  if(c.y > 620 || c.x < -80 || c.x > 440 || c.y < -120 || W.t > 40) W.lost = true;
}
function snackCut(W, x1, y1, x2, y2){
  let cut = false;
  for(const r of W.ropes){ for(let i = 0; i < r.pts.length - 1; i++){ if(i === r.cut || r.cut >= 0) continue; const a = r.pts[i], b = r.pts[i+1];
      if(segX(x1, y1, x2, y2, a.x, a.y, b.x, b.y)){ r.cut = i; r.pts[i+1] !== W.candy && (r.pts[i+1].w = 1); cut = true; break; } } }
  // a cut rope no longer holds the treat: detach the lower part from the treat after a moment so it falls freely
  return cut;
}
function segX(ax, ay, bx, by, cx, cy, dx, dy){ const d = (bx - ax) * (dy - cy) - (by - ay) * (dx - cx); if(!d) return false; const t = ((cx - ax) * (dy - cy) - (cy - ay) * (dx - cx)) / d, u = ((cx - ax) * (by - ay) - (cy - ay) * (bx - ax)) / d; return t >= 0 && t <= 1 && u >= 0 && u <= 1; }

  for(const bu of W.bubbles) if(bu.alive && Math.hypot(x - bu.x, y - bu.y) < bu.r + 16){ bu.alive = false; if(W.candy.bubble === bu) W.candy.bubble = null; return "pop"; }
  for(const f of W.fans) if(Math.hypot(x - f.x, y - f.y) < 44){ f.on = !f.on; return f.on ? "fanOn" : "fanOff"; }
  return "";
}

// FAMILY VOICES: anyone in the family (parents, grandparents, aunties, uncles, big cousins) records a story in their own voice,
// one line at a time, with simple reading cues, an example to hear, and record / play back / redo for each line.
// Then the boys pick whose voice reads it (Listen). Prototype: recordings stay on this phone (IndexedDB, memory if that's blocked).
// Real app later: sound files in OneDrive (never the public GitHub repo); family far away record and share through the Cloudflare circle.
// =====================================================================
const FV_CUES = {slow:{ic:"🐢", t:"Slow down"}, whisper:{ic:"🤫", t:"Whisper"}, big:{ic:"📣", t:"Big voice!"}, pause:{ic:"⏸", t:"Pause at the ‖"}, hello:{ic:"😊", t:"Say it your own way"}};

let fvDb = null, fvDbTried = null;
function fvOpenDb(){
  if(fvDbTried) return fvDbTried;

    r.onupgradeneeded = () => { const d = r.result; if(!d.objectStoreNames.contains("voices")) d.createObjectStore("voices", {keyPath:"id"}); if(!d.objectStoreNames.contains("clips")) d.createObjectStore("clips"); };
    r.onsuccess = () => { fvDb = r.result; res(fvDb); }; r.onerror = () => res(null); r.onblocked = () => res(null); }catch(e){ res(null); } });
  return fvDbTried;
}
const fvIDB = (store, mode, op) => fvOpenDb().then(d => new Promise(res => { if(!d) return res(undefined);
  try{ const t = d.transaction(store, mode), r = op(t.objectStore(store)); t.oncomplete = () => res(r ? r.result : undefined); t.onerror = t.onabort = () => res(undefined); }catch(e){ res(undefined); } }));
const fvKey = (vid, sid, k) => vid + "|" + sid + "|" + k;
function fvMark(key, off){ const [v, s, k] = String(key).split("|"); const id = v + "|" + s; (fvHave[id] = fvHave[id] || new Set())[off ? "delete" : "add"](k); }
const fvHas = (vid, sid, k) => !!(fvHave[vid + "|" + sid] && fvHave[vid + "|" + sid].has(k));
function fvPutVoice(v){ fvMem.voices[v.id] = v; if(v.id !== "demo") fvIDB("voices", "readwrite", s => s.put(v)); }
function fvPutClip(key, val){ fvMem.clips[key] = val; if(!key.startsWith("demo|")) fvIDB("clips", "readwrite", s => s.put(val, key)); }
function fvGetClip(key){ if(fvMem.clips[key]) return Promise.resolve(fvMem.clips[key]); return fvIDB("clips", "readonly", s => s.get(key)).then(v => { if(v) fvMem.clips[key] = v; return v; }); }
function fvDelVoice(id){
  delete fvMem.voices[id]; Object.keys(fvMem.clips).filter(k => k.startsWith(id + "|")).forEach(k => delete fvMem.clips[k]);
  Object.keys(fvHave).filter(k => k.startsWith(id + "|")).forEach(k => delete fvHave[k]); fvVoices = fvVoices.filter(x => x.id !== id);
  fvIDB("voices", "readwrite", s => s.delete(id)); fvIDB("clips", "readwrite", s => s.delete(IDBKeyRange.bound(id + "|", id + "|￿")));

  const vs = await fvIDB("voices", "readonly", s => s.getAll()); const ks = await fvIDB("clips", "readonly", s => s.getAllKeys());
  (vs || []).forEach(v => { fvMem.voices[v.id] = v; }); fvVoices = Object.values(fvMem.voices).sort((a, b) => a.created - b.created);
  (ks || []).forEach(k => fvMark(k));

}

// ---------- the script: a hello, then every line of the story ----------
function fvLines(st){ const out = []; st.pages.forEach((pg, p) => pg.lines.forEach((ln, l) => out.push({k:p + "-" + l, p, l, text:ln, cues:((((st.voice || [])[p]) || [])[l] || "").split(" ").filter(Boolean)}))); return out; }

const fvReady = (v, st) => { const c = fvCount(v, st); return c.done === c.total; };
const fvAv = (v, cls) => `<span class="fv-av ${cls || ''}" style="--c:${v.colour};--t:${fvInk(v.colour)}" aria-hidden="true">${esc((v.name || "?").trim().charAt(0).toUpperCase())}</span>`;
function fvLineHTML(text, cues){
  let h = text.split(" / ").map(x => esc(x).replace(/\*([^*]+)\*/g, '<span class="fv-stamp">$1</span>'));
  if(cues.includes("pause") && h.length > 1) h[0] += ' <span class="fv-pause" aria-label="pause here">‖</span>';
  return h.join(" ");
}

// ---------- sound: an example read by the phone, and playing recordings ----------
function fvStopAll(){ fvSpeakTok++; try{ speechSynthesis.cancel(); }catch(e){} const a = fvAudio; fvAudio = null; if(a){ try{ a.pause(); }catch(e){} if(a._fin) a._fin(); } }
function fvUtter(t, cues){ const u = new SpeechSynthesisUtterance(t); u.lang = "en-IE"; u.rate = .9;
  if(cues.includes("slow")) u.rate = .68; if(cues.includes("whisper")){ u.volume = .4; u.rate = .78; u.pitch = .9; } if(cues.includes("big")){ u.volume = 1; u.pitch = 1.25; u.rate = .98; } return u; }
function fvSpeak(text, cues){
  return new Promise(res => { fvStopAll(); const tok = fvSpeakTok; const parts = cues.includes("pause") ? text.split(" / ") : [text.replace(/ \/ /g, " ")]; let i = 0;
    const next = () => { if(tok !== fvSpeakTok || i >= parts.length) return res(); const words = parts[i]; const u = fvUtter(stSpeak(words), cues); i++; let ended = false;
      const go = () => { if(ended) return; ended = true; setTimeout(next, i < parts.length ? 750 : 0); };
      u.onend = go; u.onerror = go; setTimeout(go, 2500 + words.length * 110); try{ speechSynthesis.speak(u); }catch(e){ go(); } };

    fvStopAll(); const url = URL.createObjectURL(val.blob), a = new Audio(url); fvAudio = a; let done = false;
