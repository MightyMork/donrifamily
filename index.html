<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121B33">
<title>Donrí</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#FAF8F2; --card:#FFFFFF; --ink:#121B33; --muted:#575E70; --line:#E4E1D6;
  --green:#1F6B3A; --green-soft:#E3F0E6; --blue:#2A4C8C; --blue-soft:#E4EAF6;
  --gold:#A8740E; --gold-soft:#FBF0D6; --fada:#E3B23C; --red:#B3261E; --red-soft:#FBE7E5;
  --accent:#121B33; --on-accent:#FAF8F2; --shadow:0 1px 3px rgba(18,27,51,.08);
}
[data-theme="dark"]{
  --bg:#0C1222; --card:#151D33; --ink:#EEF0F5; --muted:#A6ADBF; --line:#26304A;
  --green:#7FC79A; --green-soft:#17301F; --blue:#9DB8F2; --blue-soft:#1A2644;
  --gold:#F0C25A; --gold-soft:#3A2F14; --red:#F2A39C; --red-soft:#3D1D1A;
  --accent:#E3B23C; --on-accent:#121B33; --shadow:none;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
a,.chip,.check,.kcheck,.pinpad button{touch-action:manipulation}
a{color:var(--blue)}
.app{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;align-items:center;gap:6px}
.brand{display:flex;flex-direction:column;flex:1;min-width:0;gap:3px;background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.word{font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:800;font-size:26px;letter-spacing:-.5px;line-height:1;display:flex;align-items:flex-end}
.word .i{position:relative;display:inline-block}
.word .i svg{position:absolute;left:1px;top:-8px}
.stripe{display:flex;width:84px;height:4px;border-radius:2px;overflow:hidden}
.stripe i{flex:1}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;position:relative;flex:none}
.iconbtn svg{width:22px;height:22px}
.badge{position:absolute;top:4px;right:4px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 4px}
[data-theme="dark"] .badge{color:#1a0f0e}
.sync{width:10px;height:10px;border-radius:5px;background:var(--green);flex:none}
.sync.busy{background:var(--fada)}
.sync.off{background:var(--red)}
main{padding:14px 12px}
h1{font-family:'Bricolage Grotesque',Inter,sans-serif;font-size:28px;margin:4px 0 12px;letter-spacing:-.5px}
h2{font-size:14px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:22px 0 8px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:10px}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted);font-size:14px}
.small{font-size:13px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],select,textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:10px 12px}
textarea{min-height:120px;resize:vertical}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 4px}
.btn{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--red)}
.btn.sm{min-height:36px;padding:0 10px;font-size:14px}
.btn:disabled{opacity:.5}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{min-height:40px;border-radius:20px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-size:12px;opacity:.8}
.item{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.check{width:30px;height:30px;border-radius:9px;border:2px solid var(--muted);background:transparent;flex:none;display:flex;align-items:center;justify-content:center}
.check.on{background:var(--green);border-color:var(--green);color:var(--bg)}
.check svg{width:18px;height:18px}
.item.done .name{text-decoration:line-through;color:var(--muted)}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.warn{background:var(--gold-soft);color:var(--gold)}
.pill.bad{background:var(--red-soft);color:var(--red)}
.pill.info{background:var(--blue-soft);color:var(--blue)}
.x{width:36px;height:36px;border:0;background:transparent;color:var(--muted);border-radius:10px;flex:none}
.x svg{width:18px;height:18px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
nav.tabs button span{font-size:11px;white-space:nowrap}
nav.tabs button{border:0;background:transparent;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] svg{color:var(--ink)}
nav.tabs button:not([aria-current="page"]) .ac{stroke:currentColor}
.ac{stroke:var(--fada)}
.bi{width:1.25em;height:1.25em;vertical-align:-0.28em;flex:none}
.btn .bi,.chip .bi,.pill .bi{width:1.15em;height:1.15em}
.iconbtn .bi,nav.tabs .bi{width:24px;height:24px;vertical-align:middle}
.btn.primary .ac{stroke:var(--fada)}
.saybtn .bi{width:26px;height:26px;color:var(--blue)}
.remoji .bi{color:var(--blue)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none;align-items:flex-end;justify-content:center}
.scrim.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 14px calc(20px + env(safe-area-inset-bottom))}
.sheet .head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sheet .head h3{flex:1;margin:0;font-family:'Bricolage Grotesque',Inter,sans-serif;font-size:22px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top));z-index:60;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:500;max-width:92vw;box-shadow:0 6px 20px rgba(0,0,0,.25);display:none}
.toast.show{display:block}
.banner{border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px;background:var(--gold-soft);color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--card);min-height:40px;padding:0 14px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.day{border-top:1px solid var(--line);padding:10px 0}
.day:first-child{border-top:0}
.dayh{font-weight:700}
.dayh.today{color:var(--blue)}
.ev{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:12px;background:var(--blue-soft);margin-top:6px}
.ev.ol{background:transparent;border:1px dashed var(--line)}
.ev .t{font-weight:700;font-size:14px;min-width:48px;color:var(--blue)}
.meal{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:0}
.stat{font-family:'Bricolage Grotesque',Inter,sans-serif;font-size:30px;font-weight:800;line-height:1}
.help p,.help li{line-height:1.5}
.empty{text-align:center;color:var(--muted);padding:18px 8px;font-size:14px}
.code{font-family:ui-monospace,monospace;font-size:13px;word-break:break-all;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.welcome{max-width:520px;margin:0 auto;padding:28px 16px}
.toggle{display:flex;align-items:center;gap:10px;min-height:44px}
.toggle input{width:22px;height:22px}
.hello{font-family:'Bricolage Grotesque',Inter,sans-serif;font-size:28px;font-weight:800;letter-spacing:-.5px;margin:4px 0 0}
.tcard h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:1.1px;color:var(--muted);display:flex;align-items:center;gap:8px}
.tcard h3 .grow{flex:1}
.tcard h3 a,.tcard h3 button{font-size:13px;text-transform:none;letter-spacing:0;font-weight:600;color:var(--blue);background:none;border:0;padding:0;min-height:32px}
.bindot{width:14px;height:14px;border-radius:7px;display:inline-block;border:1px solid rgba(0,0,0,.2);flex:none}
.next{border-left:4px solid var(--fada)}
.starbig{font-family:'Bricolage Grotesque',Inter,sans-serif;font-size:56px;font-weight:800;line-height:1.1}
.kidtxt{font-size:19px;line-height:1.5;letter-spacing:.2px}
.remoji{font-size:34px;line-height:1;flex:none}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--fada);border-radius:6px}
.gain{color:var(--green)}
.starcard{text-align:left;margin:0;flex:1;min-width:0}
.note{background:var(--gold-soft);border-radius:10px;padding:6px 10px;font-size:14px;margin-top:6px;line-height:1.4}
details summary{cursor:pointer;min-height:32px;display:flex;align-items:center}
body.kiosk header.top,body.kiosk nav.tabs{display:none!important}
body.kiosk .app{max-width:1280px;padding-bottom:20px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:start}
.kgrid .card{margin:0;padding:18px}
.kt{font-size:19px;line-height:1.45}
.kt h3{margin:0 0 10px;font-size:15px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);display:flex;align-items:center;gap:8px}
.kt h3 .grow{flex:1}
.ktop{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.kclock{font-family:'Bricolage Grotesque',Inter,sans-serif;font-size:72px;font-weight:800;line-height:.9;letter-spacing:-2px}
.kbig{font-family:'Bricolage Grotesque',Inter,sans-serif;font-size:26px;font-weight:800;line-height:1.2}
.kt .check{width:40px;height:40px;border-radius:12px}
.kt .item{padding:12px 4px}
.kexit{min-height:44px;border-radius:12px;border:1px dashed var(--line);background:transparent;color:var(--muted);padding:0 14px;font-size:14px;user-select:none;-webkit-user-select:none;touch-action:none}
.kexit.holding{background:var(--gold-soft);color:var(--ink)}
.kid{font-size:20px;line-height:1.6;letter-spacing:.02em;word-spacing:.08em;max-width:720px;margin:0 auto}
.kidhi{font-family:'Bricolage Grotesque',Inter,sans-serif;font-size:34px;font-weight:800;line-height:1.15}
.kid h2{font-size:16px;margin:24px 0 10px}
.kidjob{display:flex;align-items:center;gap:14px;padding:16px}
.kcheck{width:58px;height:58px;border-radius:16px;border:3px solid var(--muted);background:var(--card);flex:none;display:flex;align-items:center;justify-content:center;font-size:28px}
.kcheck.on{background:var(--green);border-color:var(--green);color:var(--bg)}
body.nospeech .saybtn{display:none!important}
.saybtn{min-width:48px;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:22px;flex:none}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:10px auto}
.pinpad button{min-height:64px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-size:26px;font-weight:700}
.pindots{text-align:center;font-size:34px;letter-spacing:12px;min-height:44px}
.petscene{position:relative;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;overflow:hidden;border:0;padding-bottom:14px}
.petitem{position:absolute;font-size:36px}
.petbob{animation:petbob 2.8s ease-in-out infinite}
@keyframes petbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.petname{font-family:'Bricolage Grotesque',Inter,sans-serif;font-size:28px;font-weight:800;color:#121B33;background:rgba(255,255,255,.75);border-radius:12px;padding:2px 14px}
.needgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.needbtn{display:flex;flex-direction:column;align-items:center;gap:6px;margin:0;font-size:18px;min-height:120px}
.needbtn:disabled{opacity:.55}
.stage{position:relative;height:300px;border-radius:22px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.45),0 10px 28px rgba(18,27,51,.16)}
.stage .scene{position:absolute;inset:0;width:100%;height:100%}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 10%,rgba(40,60,120,.35),rgba(8,14,36,.72));opacity:0;transition:opacity 1.2s}
.stage.night::after{opacity:1}
.actor{position:absolute;width:150px;height:150px;margin-left:-75px;z-index:2;touch-action:none}
.actor .flipper{transform:scaleX(var(--dir,1));transition:transform .25s}
.actor .pet svg{animation:breathe 3.2s ease-in-out infinite;transform-origin:50% 92%}
@keyframes breathe{50%{transform:scale(1.025,.985)}}
.actor .shadow{position:absolute;left:34px;right:34px;bottom:0;height:14px;border-radius:50%;background:rgba(0,0,0,.2);filter:blur(4px)}
.actor.walking .flipper .pet{animation:walkbob .34s ease-in-out infinite}
@keyframes walkbob{50%{transform:translateY(-7px) rotate(2deg)}}
.actor.excited .flipper .pet{animation:jump .5s ease-out 3}
@keyframes jump{40%{transform:translateY(-36px) scale(1.06)}}
.pet .tail{transform-box:fill-box;transform-origin:0% 50%}
.actor.wag .pet .tail{animation:wag .22s ease-in-out infinite}
@keyframes wag{50%{transform:rotate(-16deg)}}
.pet .ec,.pet .mo,.pet .ml,.pet .my,.pet .brow,.pet .lid{display:none}
.pet.st-ok .mh{display:none}.pet.st-ok .mo{display:inline}
.pet.st-low .mh{display:none}.pet.st-low .ml,.pet.st-low .brow{display:inline}
.pet.st-tired .mh{display:none}.pet.st-tired .mo,.pet.st-tired .lid{display:inline}
.pet.st-sleep .eo,.pet.st-sleep .mh{display:none}.pet.st-sleep .ec,.pet.st-sleep .mo{display:inline}
.pet.st-yawn .eo,.pet.st-yawn .mh{display:none}.pet.st-yawn .ec,.pet.st-yawn .my{display:inline}
.heartp{position:absolute;font-size:24px;pointer-events:none;z-index:4;animation:floatup 1.3s ease-out forwards}
.zz{position:absolute;font:800 22px 'Bricolage Grotesque',sans-serif;color:#fff;pointer-events:none;z-index:4;animation:floatup 2.4s ease-out forwards}
@keyframes floatup{to{transform:translate(var(--hx,20px),-90px) scale(1.3);opacity:0}}
.sbubble{position:absolute;left:50%;top:14px;transform:translateX(-50%);max-width:86%;background:#fff;color:#121B33;border-radius:16px;padding:8px 14px;font-weight:700;font-size:17px;line-height:1.35;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.2);z-index:5;animation:pop .25s ease-out}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}}
.ball{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;z-index:3;touch-action:none;cursor:grab;box-shadow:0 4px 8px rgba(0,0,0,.25)}
.ball-puppy{background:radial-gradient(circle at 34% 30%,#FDFFB8,#D9EF4A 45%,#93B81E)}
.ball-dragon{background:radial-gradient(circle at 34% 30%,#FFC7B8,#F2553D 50%,#B22A17)}
.ball-axolotl{background:radial-gradient(circle at 34% 30%,#fff,#FFE3C7 55%,#F4A25F)}
.ball::before{content:"";position:absolute;inset:-14px;border-radius:50%}
.petlabel{position:absolute;left:12px;top:12px;z-index:3;font:800 20px 'Bricolage Grotesque',Inter,sans-serif;color:#121B33;background:rgba(255,255,255,.78);border-radius:12px;padding:2px 12px;backdrop-filter:blur(4px)}
.stagehint{position:absolute;left:12px;right:12px;bottom:10px;z-index:4;text-align:center;font-size:15px;font-weight:600;color:#121B33;background:rgba(255,255,255,.82);border-radius:12px;padding:6px 10px;transition:opacity .8s;pointer-events:none}
.tbub{position:absolute;bottom:-12px;border-radius:50%;border:2px solid rgba(255,255,255,.75);animation:rise 6.5s linear infinite;pointer-events:none}
@keyframes rise{to{transform:translateY(-320px)}}
.petitem{z-index:1}
.fab{position:fixed;right:max(16px, calc(50vw - 304px));bottom:calc(78px + env(safe-area-inset-bottom));z-index:25;width:58px;height:58px;border-radius:29px;border:0;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(18,27,51,.3)}
body.kiosk .fab,body.gamefull .fab{display:none!important}
.qgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qbtn{margin:0;display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:92px;text-align:left}
.qbtn span{font-size:26px}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:10px}
.ptile{position:relative;padding:0;border:0;background:var(--line);border-radius:10px;overflow:hidden;aspect-ratio:1}
.ptile img{width:100%;height:100%;object-fit:cover;display:block}
.pfrom{position:absolute;left:6px;top:6px;width:12px;height:12px;border-radius:6px;border:2px solid #fff}
.preact{position:absolute;right:5px;bottom:5px;background:rgba(255,255,255,.9);color:#121B33;border-radius:10px;font-size:12px;font-weight:700;padding:1px 6px}
.pdel{position:absolute;right:4px;top:4px;width:30px;height:30px;border-radius:15px;border:0;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center}
.pdel svg{width:16px;height:16px}
.agrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:6px}
.acard{padding:0;border:1px solid var(--line);background:var(--card);border-radius:14px;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.acard img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.aempty{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;background:var(--bg)}
.aname{padding:8px 10px;display:flex;flex-direction:column;gap:2px}
main{padding-bottom:90px}

[data-palette="green"]{--accent:#1F6B3A;--blue:#1F6B3A;--blue-soft:#E3F0E6}
[data-theme="dark"][data-palette="green"]{--accent:#7FC79A;--on-accent:#0C1222;--blue:#7FC79A;--blue-soft:#17301F}
[data-palette="blue"]{--accent:#2A4C8C}
[data-theme="dark"][data-palette="blue"]{--accent:#9DB8F2;--on-accent:#0C1222}
[data-palette="gold"]{--accent:#8A5F0B;--blue:#8A5F0B;--blue-soft:#FBF0D6}
[data-theme="dark"][data-palette="gold"]{--accent:#F0C25A;--on-accent:#121B33;--blue:#F0C25A;--blue-soft:#3A2F14}
[data-palette="primrose"]{--bg:#FBF6DC;--card:#FFFEF7;--line:#E6DDB2}

body.introon{overflow:hidden}
.ibar{display:flex;gap:4px;padding:calc(12px + env(safe-area-inset-top)) 14px 0}

.iseg i{display:block;height:100%;width:0;background:#E3B23C}

.itools{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px 0}

// =====================================================================
// Microsoft sign-in (OAuth 2.0 auth code + PKCE, personal accounts)
// =====================================================================
const AUTH = "https://login.microsoftonline.com/consumers/oauth2/v2.0";
const GRAPH = "https://graph.microsoft.com/v1.0";
const SCOPES = "openid profile offline_access User.Read Files.ReadWrite.All Calendars.ReadWrite";
const REDIRECT = location.origin + location.pathname;
let cfg = ls.get("donri.cfg", {});            // {c: clientId, d: driveId, i: itemId, f: folderId}
let tok = ls.get("donri.tok", null);          // {at, rt, exp}
let me = ls.get("donri.me", null);            // {name, email}

async function signIn(silent){
  if(!cfg.c){ toast("Add the Client ID first."); return; }
  const verifier = rand(64);
  const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  const state = rand(16);
  ss.set("donri.pkce", JSON.stringify({verifier, state}));
  const q = new URLSearchParams({client_id:cfg.c, response_type:"code", redirect_uri:REDIRECT, scope:SCOPES, state, code_challenge:challenge, code_challenge_method:"S256", response_mode:"query"});
  if(silent) q.set("prompt","none");
  location.assign(AUTH + "/authorize?" + q.toString());
}
async function tokenRequest(params){
  const r = await fetch(AUTH + "/token", {method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"}, body:new URLSearchParams({client_id:cfg.c, scope:SCOPES, ...params})});
  const j = await r.json().catch(() => ({}));
  if(!r.ok || !j.access_token) throw Object.assign(new Error(j.error_description || "token"), {code:j.error || "token_error"});
  tok = {at:j.access_token, rt:j.refresh_token || (tok && tok.rt), exp:Date.now() + (j.expires_in||3600)*1000};
  ls.set("donri.tok", tok);
  return tok.at;
}
async function handleRedirect(){
  const q = new URLSearchParams(location.search);
  if(!q.has("code") && !q.has("error")) return;
  const saved = JSON.parse(ss.get("donri.pkce") || "null"); ss.del("donri.pkce");
  history.replaceState(null, "", REDIRECT + location.hash);
  if(q.has("error")){ if(q.get("error") !== "login_required" && q.get("error") !== "interaction_required") toast("Sign-in didn't finish: " + (q.get("error_description")||q.get("error")).slice(0,140), 6000); return; }
  if(!saved || saved.state !== q.get("state")){ toast("Sign-in expired, please try again."); return; }
  try{ await tokenRequest({grant_type:"authorization_code", code:q.get("code"), redirect_uri:REDIRECT, code_verifier:saved.verifier}); ss.del("donri.silent"); }
  catch(e){ toast("Couldn't finish signing in (" + e.code + ").", 6000); }
}
let refreshing = null;
async function accessToken(){
  if(tok && tok.at && tok.exp - Date.now() > 90000) return tok.at;
  if(!tok || !tok.rt) throw Object.assign(new Error("signed out"), {code:"signed_out"});
  if(!refreshing) refreshing = tokenRequest({grant_type:"refresh_token", refresh_token:tok.rt}).finally(() => refreshing = null);
  try{ return await refreshing; }
  catch(e){
    if(e.code === "invalid_grant" || e.code === "interaction_required"){
      tok = null; ls.del("donri.tok");
      if(!ss.get("donri.silent")){ ss.set("donri.silent","1"); signIn(true); await new Promise(()=>{}); }
    }
    throw Object.assign(new Error("signed out"), {code:"signed_out"});
  }
}
async function graph(path, opts = {}){
  const t = await accessToken();
  const r = await fetch(path.startsWith("http") ? path : GRAPH + path, {...opts, headers:{Authorization:"Bearer " + t, ...(opts.headers||{})}});
  if(r.status === 401){ tok.exp = 0; ls.set("donri.tok", tok); }
  return r;
}
async function graphJson(path, opts){ const r = await graph(path, opts); const j = await r.json().catch(() => ({})); if(!r.ok) throw Object.assign(new Error((j.error && j.error.message) || r.status), {status:r.status, code:j.error && j.error.code}); return j; }
function signOut(){ ls.del("donri.tok"); ls.del("donri.me"); tok = null; me = null; closeSheet(); render(); }

// =====================================================================
// Data: one JSON file in OneDrive, merged document-by-document
// =====================================================================
// Shape: {app:"donri", v:1, cols:{shop:{<id>:{...fields, u:<ms>}}, ...}}
// A deleted document is {_del:true, u}. The newer "u" wins when two copies differ.
const COLS = ["settings","allergies","requests","shop","setlists","events","meals","chores","points","rewards","suggest","renewals","recipes","people","gifts","meds","conditions","history","vaccines","growth","visits","play","activity","outbox"];
let D = ls.get("donri.data", null);
let etag = ls.get("donri.etag", null);
let dirty = ls.get("donri.dirty", false);
let syncState = "ok"; // ok | busy | off
const blank = () => ({app:"donri", v:1, cols:{}});
// "Just me" health entries never go in the shared family file. They live in P: Donri/donri-private.json
// in the signed-in person's own OneDrive (never shared), and are merged into what this phone shows.
const PRIVATE_COLS = ["meds","conditions","history","vaccines","growth","visits"];
let P = ls.get("donri.pdata", null);
let petag = ls.get("donri.petag", null);
let pdirty = ls.get("donri.pdirty", false);
let pItem = ls.get("donri.pitem", null);
function persist(){ ls.set("donri.data", D); ls.set("donri.etag", etag); ls.set("donri.dirty", dirty); ls.set("donri.pdata", P); ls.set("donri.petag", petag); ls.set("donri.pdirty", pdirty); ls.set("donri.pitem", pItem); }
function docs(col){ const out = []; for(const S of [D, P]){ const c = (S && S.cols[col]) || {}; for(const id of Object.keys(c)) if(!c[id]._del) out.push({id, ...c[id]}); } return out; }
function doc(col,id){ for(const S of [P, D]){ const x = S && S.cols[col] && S.cols[col][id]; if(x && !x._del) return {id, ...x}; } return null; }
const live = (S,col,id) => !!(S && S.cols[col] && S.cols[col][id] && !S.cols[col][id]._del);
function stampIn(S,col,id){ const cur = S && S.cols[col] && S.cols[col][id]; return Math.max(Date.now(), ((cur && cur.u) || 0) + 1); }
function stamp(col,id){ return stampIn(D,col,id); }
function put(col,id,data){
  const {id:_drop, ...rest} = data;
  if(PRIVATE_COLS.includes(col) && rest.private){
    P = P || blank(); (P.cols[col] = P.cols[col] || {})[id] = {...rest, u:stampIn(P,col,id)}; pdirty = true;
    if(live(D,col,id)){ D.cols[col][id] = {_del:true, u:stampIn(D,col,id)}; dirty = true; } // moved from shared to "Just me"
  } else {
    (D.cols[col] = D.cols[col] || {})[id] = {...rest, u:stampIn(D,col,id)}; dirty = true;
    if(live(P,col,id)){ P.cols[col][id] = {_del:true, u:stampIn(P,col,id)}; pdirty = true; } // moved from "Just me" to shared
  }
  changed();
}
function patch(col,id,data){ const cur = doc(col,id); if(!cur) return; const {id:_drop, ...rest} = cur; put(col,id,{...rest, ...data}); }
function del(col,id){
  if(live(P,col,id)){ P.cols[col][id] = {_del:true, u:stampIn(P,col,id)}; pdirty = true; }
  else { (D.cols[col] = D.cols[col] || {})[id] = {_del:true, u:stampIn(D,col,id)}; dirty = true; }
  changed();
}
function changed(){ persist(); render(); scheduleSave(); }
function merge(a,b){
  const out = blank();
  for(const col of new Set([...Object.keys((a&&a.cols)||{}), ...Object.keys((b&&b.cols)||{})])){
    const ca = (a && a.cols[col]) || {}, cb = (b && b.cols[col]) || {}; const o = out.cols[col] = {};
    for(const id of new Set([...Object.keys(ca), ...Object.keys(cb)])){
      const x = ca[id], y = cb[id];
      o[id] = !x ? y : !y ? x : ((x.u||0) > (y.u||0) ? x : y);
    }
  }
  return out;
}
function aheadOf(a, b){
  for(const col of Object.keys(a.cols)) for(const [id,x] of Object.entries(a.cols[col])){
    const y = b && b.cols && b.cols[col] && b.cols[col][id];
    if(!y || (y.u||0) < (x.u||0)) return true;
  }
  return false;
}
function tidy(){
  const cut = Date.now() - 30*86400000;
  for(const col of Object.keys(D.cols)) for(const [id,x] of Object.entries(D.cols[col])) if(x._del && (x.u||0) < cut) delete D.cols[col][id];
  const acts = docs("activity").sort((x,y) => (y.at||0) - (x.at||0));
  acts.slice(150).forEach(a => { D.cols.activity[a.id] = {_del:true, u:Date.now()}; });
}

let lock = Promise.resolve();
const exclusive = fn => (lock = lock.then(fn, fn));
function setSync(s){ syncState = s; const el = $("#sync"); el.className = "sync" + (s==="busy" ? " busy" : s==="off" ? " off" : ""); el.setAttribute("aria-label", s==="busy" ? "Syncing" : s==="off" ? "Not synced" : "Synced"); }

async function pull(force){
  const meta = await graphJson(`/drives/${cfg.d}/items/${cfg.i}`);
  if(!force && meta.eTag === etag) return false;
  const r = await fetch(meta["@microsoft.graph.downloadUrl"], {cache:"no-store"});
  if(!r.ok) throw new Error("download " + r.status);
  const remote = await r.json();
  const before = D;
  D = merge(D || blank(), remote);
  etag = meta.eTag;
  dirty = aheadOf(D, remote); // true when we hold changes the file doesn't have yet
  persist();
  noticeIncoming(before, D);
  return true;
}
async function push(){
  for(let attempt = 0; attempt < 4 && dirty; attempt++){
    tidy();
    const r = await graph(`/drives/${cfg.d}/items/${cfg.i}/content`, {method:"PUT", headers:{"Content-Type":"application/json", ...(etag ? {"If-Match":etag} : {})}, body:JSON.stringify(D)});
    if(r.status === 412 || r.status === 409){ await pull(true); continue; }
    if(!r.ok) throw new Error("upload " + r.status);
    const j = await r.json(); etag = j.eTag; dirty = false; persist(); return;
  }
}
// The private file: found (or made, the first time something is marked "Just me") in your own OneDrive
const PRIVATE_PATH = "/me/drive/root:/Donri/donri-private.json";
async function readPrivate(meta){ const r = await fetch(meta["@microsoft.graph.downloadUrl"], {cache:"no-store"}); if(!r.ok) throw new Error("private download " + r.status); return r.json(); }
async function syncPrivate(force){
  if(!pItem){
    try{ const m = await graphJson(PRIVATE_PATH); pItem = m.id; }
    catch(e){
      if(e.status !== 404) throw e;
      if(!pdirty) return false; // nothing private yet, so no file needed
      const m = await graphJson(PRIVATE_PATH + ":/content?@microsoft.graph.conflictBehavior=fail", {method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(P || blank())});
      pItem = m.id; petag = m.eTag; pdirty = false; persist(); return true;
    }
  }
  let meta;
  try{ meta = await graphJson(`/me/drive/items/${pItem}`); }
  catch(e){ if(e.status === 404){ pItem = null; petag = null; persist(); return syncPrivate(force); } throw e; }
  let got = false;
  if(force || meta.eTag !== petag){ const remote = await readPrivate(meta); P = merge(P || blank(), remote); petag = meta.eTag; pdirty = aheadOf(P, remote); got = true; }
  for(let attempt = 0; attempt < 4 && pdirty; attempt++){
    const cut = Date.now() - 30*86400000;
    for(const col of Object.keys(P.cols)) for(const [id,x] of Object.entries(P.cols[col])) if(x._del && (x.u||0) < cut) delete P.cols[col][id];
    const r = await graph(`/me/drive/items/${pItem}/content`, {method:"PUT", headers:{"Content-Type":"application/json", ...(petag ? {"If-Match":petag} : {})}, body:JSON.stringify(P)});
    if(r.status === 412 || r.status === 409){ const m2 = await graphJson(`/me/drive/items/${pItem}`); P = merge(P, await readPrivate(m2)); petag = m2.eTag; continue; }
    if(!r.ok) throw new Error("private upload " + r.status);
    const j = await r.json(); petag = j.eTag; pdirty = false;
  }
  persist(); return got;
}
function sync(force){
  if(!cfg.d || !tok) return Promise.resolve();
  return exclusive(async () => {
    setSync("busy");
    try{ const got = await pull(force); if(dirty) await push();
      let pgot = false; try{ pgot = await syncPrivate(force); }catch(pe){ if(pe.code === "signed_out") throw pe; toast("Couldn't reach your private (Just me) file. It'll try again shortly.", 5000); }
      setSync("ok"); if(got || pgot) { render(); } if(got) sendOutbox(); ensurePhotoFolder(); if(myName()) checkRenewalReminders(); }
    catch(e){ setSync("off"); if(e.code === "signed_out"){ render(); } else if(e.status === 404 || e.status === 403){ toast("Can't reach the family file. Check it's still shared with you.", 6000); } }
  });
}
let saveT = null;
function scheduleSave(){ clearTimeout(saveT); saveT = setTimeout(() => sync(false), 700); }
setInterval(() => { if(document.visibilityState === "visible") sync(false); }, 20000);
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible"){ sync(false); if(page === "today") render(); } });
window.addEventListener("online", () => sync(false));

// Things other people did since we last looked
function noticeIncoming(before, after){
  if(!before) return;
  const msgs = [];
  for(const [id,x] of Object.entries((after.cols.shop)||{})){
    const old = before.cols.shop && before.cols.shop[id];
    if(!x._del && x.done && !(old && old.done) && x.doneBy && x.doneBy !== myName()) msgs.push(`${x.doneBy} picked up ${x.name}`);
  }
  for(const [id,x] of Object.entries((after.cols.events)||{})){
    if(!x._del && !(before.cols.events && before.cols.events[id]) && x.by && x.by !== myName()) msgs.push(`${x.by} added ${x.title}`);
  }
  if(msgs.length) toast(msgs.slice(0,2).join(" · ") + (msgs.length > 2 ? ` +${msgs.length-2} more` : ""), 5000);
}

const settings = () => doc("settings","family") || {members:[]};
const members = () => (settings().members || []).filter(m => m && m.name);
const adults = () => members().filter(m => m.topic);
const myName = () => ls.get("donri.who", "") || "";
const meMember = () => members().find(m => m.name === myName());
const NOTIFY_KINDS = {shop:"Shopping (added and picked up)", calendar:"New calendar events", meals:"Meal plan changes", chores:"Chores done", assigned:"Chores given to me", stars:"Stars swapped for rewards", renewals:"Renewals coming due", meds:"Medication running low", families:"Other families (invites, polls, wish-list ideas)", sits:"Babysitting"};
const NOTIFY_DEFAULT = {shop:true, calendar:true, meals:true, chores:false, assigned:true, stars:true, renewals:true, meds:true, families:true, sits:true};
const wants = (m,k) => (m.notify && k in m.notify) ? !!m.notify[k] : NOTIFY_DEFAULT[k];
async function ntfy(topic, title, message, tags, link){
  try{ await fetch("https://ntfy.sh/", {method:"POST", body:JSON.stringify({topic, title, message, tags:tags||[], click:REDIRECT + "#" + (link || "today")})}); }catch(e){}
}

  targets.forEach(m => ntfy(m.topic, title, message, opts.tags, opts.link || NOTE_LINK[kind] || "today"));
}
// Where tapping a notification takes you: "page" or "page/extra" (extra = a shop, or cal / school to open that panel)
const NOTE_LINK = {shop:"shop", calendar:"today/cal", meals:"meals", chores:"chores", assigned:"chores", stars:"today", meds:"meds", renewals:"renew", school:"today/school", families:"families", sits:"families/sits"};
const PAGE_KEYS = ["today","shop","meals","chores","families","gifts","meds","renew"];
function goLink(link, force){
  const [pg, extra] = String(link || "").replace(/^#/, "").split("/");
  if(force){ if(kidMode){ stopPlay(); kidView = "home"; kidMode = ""; ls.set("donri.kid", ""); resetZoom(); } if(kitchen){ kitchen = false; ls.set("donri.kitchen", false); resetZoom(); } }
  if(kidMode || kitchen) return; // a boy's tablet or the kitchen screen stays where it is
  closeSheet(); page = PAGE_KEYS.includes(pg) ? pg : "today"; ls.set("donri.page", page);
  if(extra && STORES[extra]){ store = extra; ls.set("donri.store", store); }
  if(page === "families" && extra && FAM_VIEWS.some(x => x[0] === extra)) famView = extra;
  history.replaceState(null, "", "#" + page); window.scrollTo(0,0); render();
  if(extra === "cal") calSheet(); else if(extra === "school") schoolSheet();
}
// Group bursts (e.g. ticking five items) into one notification
const batches = {};
function notifyBatched(key, kind, title, item, verb, link){
  const b = batches[key] = batches[key] || {items:[], t:null};
  b.items.push(item); clearTimeout(b.t);
  b.t = setTimeout(() => { const n = b.items.length; notify(kind, title, n === 1 ? `${myName()||"Someone"} ${verb} ${b.items[0]}` : `${myName()||"Someone"} ${verb} ${n} items: ${b.items.slice(0,6).join(", ")}${n>6?"…":""}`, {tags:["shopping_cart"], link}); delete batches[key]; }, 15000);
}
// Messages Claude (or anyone) leaves in the outbox get sent once by whichever phone sees them first
function sendOutbox(){

}

// Today's events from your own Outlook (shown dashed, only to you)
let olToday = {date:"", items:[], state:"idle", at:0};
async function loadTodayOutlook(){
  const t = today();
  if(olToday.date === t && (olToday.state === "loading" || Date.now() - olToday.at < (olToday.state === "ok" ? 600000 : 60000))) return;
  olToday = {date:t, items:olToday.date === t ? olToday.items : [], state:"loading", at:Date.now()};
  try{
    const q = new URLSearchParams({startDateTime:t+"T00:00:00", endDateTime:ymd(addDays(parse(t),2))+"T00:00:00", $select:"subject,start,end,isAllDay", $orderby:"start/dateTime", $top:"50"});
    const j = await graphJson("/me/calendarView?" + q.toString(), {headers:{Prefer:'outlook.timezone="GMT Standard Time"'}});
    if(olToday.date !== t) return;
    olToday.items = (j.value||[]).map(e => ({title:e.subject, date:e.start.dateTime.slice(0,10), start:e.isAllDay ? "" : e.start.dateTime.slice(11,16)}));
    olToday.state = "ok";
  }catch(e){ olToday.state = "error"; }
  olToday.at = Date.now();
  if(page === "today") render();
}
const BIN_COLOURS = {black:"#2B2B2B", green:"#2E8B57", brown:"#8B5A2B", blue:"#2A6CC9", purple:"#7B4FB3", grey:"#9AA0A6"};
const DOW = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function binsOn(dateStr){
  const b = doc("settings","bins"); if(!b || !b.anchor) return [];
  const d = parse(dateStr); if(d.getDay() !== parse(b.anchor).getDay()) return [];
  const weeks = Math.round(daysBetween(b.anchor, dateStr) / 7);
  return (b.streams||[]).filter(s => { const ev = Number(s.every)||1; return ((weeks - (Number(s.offset)||0)) % ev + ev) % ev === 0; });
}
function binCard(){
  const b = doc("settings","bins");
  if(!b || !b.anchor) return `<div class="card tcard"><h3>${ICON.bin.replace('<svg','<svg width="16" height="16"')}<span class="grow">Bins</span></h3><p class="muted small" style="margin:0 0 8px">Tell Donrí your collection day and it'll remind you the evening before.</p><button class="btn sm" data-act="editBins">Set up bin day</button></div>`;
  const now = new Date(), t = today(), tm = ymd(addDays(now,1));
  let when = "", list = [];
  if(binsOn(tm).length && now.getHours() >= 12){ when = "Out tonight"; list = binsOn(tm); }
  else if(binsOn(t).length){ when = "Collection today"; list = binsOn(t); }
  else { for(let i = 1; i <= 14; i++){ const d = ymd(addDays(now,i)); if(binsOn(d).length){ when = "Next: " + (i===1 ? "tomorrow" : DAYS[parse(d).getDay()] + " " + parse(d).getDate() + " " + MONTHS[parse(d).getMonth()]); list = binsOn(d); break; } } }
  const urgent = when === "Out tonight" || when === "Collection today";
  return `<div class="card tcard ${urgent?'next':''}"><h3>${ICON.bin.replace('<svg','<svg width="16" height="16"')}<span class="grow">Bins</span><button data-act="editBins">Edit</button></h3>
    <div style="font-weight:700;margin-bottom:6px">${esc(when || "No collection in the next two weeks")}</div>
    ${list.map(s => `<div class="row" style="min-height:30px"><span class="bindot" style="background:${BIN_COLOURS[s.colour]||'#999'}"></span><span>${esc(s.name)}</span></div>`).join("")}</div>`;
}

function choreDue(c){ if(!c.lastDone) return true; if(c.freq === "once") return false; return daysBetween(c.lastDone, today()) >= (FREQ[c.freq]||7); }

const assignees = c => Array.isArray(c.assignees) ? c.assignees : (c.who ? [c.who] : []);
const turnOf = c => { const a = assignees(c); return c.rotate && a.length > 1 ? (a.includes(c.turn) ? c.turn : a[0]) : ""; };
const isFor = (c, n) => { const a = assignees(c); if(!a.length) return true; return c.rotate && a.length > 1 ? turnOf(c) === n : a.includes(n); };

// ---------- RENEWALS (car tax, NCT, insurance, TV licence, passports, subscriptions) ----------
const RENEW_KINDS = {
  cartax:{label:"Car tax", icon:I.car, every:12, remind:30, link:"https://www.motortax.ie/", linkLabel:"Renew on motortax.ie"},
  nct:{label:"NCT", icon:I.wrench, every:24, remind:60, link:"https://www.ncts.ie/", linkLabel:"Book on ncts.ie"},
  insurance:{label:"Insurance", icon:I.shield, every:12, remind:30},
  tv:{label:"TV licence", icon:I.tv, every:12, remind:30, link:"https://www.tvlicence.ie/", linkLabel:"Renew on tvlicence.ie"},
  passport:{label:"Passport", icon:I.passport, every:120, remind:120, link:"https://www.ireland.ie/en/dfa/passports/passport-online/", linkLabel:"Passport Online"},
  licence:{label:"Driving licence", icon:I.idcard, every:120, remind:60, link:"https://www.ndls.ie/", linkLabel:"ndls.ie"},
  sub:{label:"Subscription", icon:I.refresh, every:1, remind:7, auto:true},
  other:{label:"Other", icon:I.doc, every:12, remind:30}
};
const EVERY = [[1,"Every month"],[3,"Every 3 months"],[6,"Every 6 months"],[12,"Every year"],[24,"Every 2 years"],[60,"Every 5 years"],[120,"Every 10 years"],[0,"Just once"]];
const renewKind = r => RENEW_KINDS[r.kind] || RENEW_KINDS.other;
function addMonths(dateStr, n){ const d = parse(dateStr); const day = d.getDate(); const x = new Date(d.getFullYear(), d.getMonth() + n, 1); const last = new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate(); x.setDate(Math.min(day, last)); return ymd(x); }
function renewDue(r){ let due = r.due || today(); const ev = Number(r.every)||0; if(r.autoRenews && ev > 0){ let guard = 0; while(due < today() && guard++ < 600) due = addMonths(due, ev); } return due; }
function renewInfo(r){
  const due = renewDue(r); const days = daysBetween(today(), due); const remind = Number(r.remindDays)||renewKind(r).remind||30;
  const when = days === 0 ? "today" : days === 1 ? "tomorrow" : days > 60 ? `in ${Math.round(days/30.4)} months` : `in ${days} days`;
  if(r.autoRenews) return {due, days, st:["info", days === 0 ? "Today" : "Next " + nice(due).slice(4)], label:"Next " + nice(due).slice(4), when};
  const st = days < 0 ? ["bad","Overdue"] : days <= remind ? ["warn", days === 0 ? "Due today" : "Due " + when] : ["ok", when.charAt(0).toUpperCase() + when.slice(1)];
  return {due, days, st, label:st[1], when};
}

function pPet(kid, ctx){

// ---------- SHARED PHOTOS and COLLECTIONS ----------
// Prototype: photos are small JPEGs in c_photos, collections in c_albums. Real app: files in the shared OneDrive
// folder Donri/Photos/<collection>, with likes, captions and who-can-see in the circle file.
let photoDraft = [], photoFiles = [], photoAlbum = "", photoOpen = "";
// Real app, before the circle: each photo is a JPEG in Donri/Photos in the family file owner's OneDrive.
// The owner's phone creates that folder and shares it (write) with the other grown-ups; settings/photos = {folder, invited[]}.
const BLANK_IMG = "data:image/gif;base64,R0lGODlhAQABAAAAACw=";
const phCache = {}; let phBusy = {}, phT = null, phCheckAt = 0;
function phSrc(p, size){
  if(p.photo) return `src="${esc(p.photo)}"`;
  if(!p.file) return `src="${BLANK_IMG}"`;
  const c = phCache[p.file + size]; if(c && Date.now() - c.at < 45 * 60000) return `src="${esc(c.url)}"`;
  clearTimeout(phT); phT = setTimeout(phHydrate, 30);
  return `src="${BLANK_IMG}" data-ph="${esc(p.file)}" data-sz="${size}"`;
}
async function phUrl(file, size){
  const k = file + size, c = phCache[k]; if(c && Date.now() - c.at < 45 * 60000) return c.url;
  if(phBusy[k]) return phBusy[k];
  phBusy[k] = (async () => { try{
    const j = await graphJson(`/drives/${cfg.d}/items/${file}/thumbnails`); const t = (j.value || [])[0] || {};
    let url = (t[size] || t.large || t.medium || {}).url;
    if(!url){ const m = await graphJson(`/drives/${cfg.d}/items/${file}?select=id,@microsoft.graph.downloadUrl`); url = m["@microsoft.graph.downloadUrl"]; }
    if(url) phCache[k] = {url, at:Date.now()}; return url || "";
  }catch(e){ return ""; } finally{ delete phBusy[k]; } })();
  return phBusy[k];
}
function phHydrate(){ document.querySelectorAll("img[data-ph]").forEach(async img => { const f = img.dataset.ph, sz = img.dataset.sz || "medium"; img.removeAttribute("data-ph"); const u = await phUrl(f, sz); if(u) img.src = u; else img.alt = "Photo not available offline"; }); }
const photoSet = () => doc("settings","photos") || {};
async function ensurePhotoFolder(){
  if(CIRCLE_READY || !cfg.f || !me) return; // only the phone that created the family file owns its folder
  let ps = photoSet(), folder = ps.folder;
  if(folder && Date.now() - phCheckAt < 10 * 60000) return; phCheckAt = Date.now();

function photoBlob(file){
  return new Promise((ok, no) => { const r = new FileReader(); r.onerror = no;
    r.onload = () => { const img = new Image(); img.onerror = no; img.onload = () => { const s = Math.min(1, 2000 / Math.max(img.width, img.height)); const c = document.createElement("canvas"); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); c.toBlob(b => b ? ok(b) : no(new Error("blob")), "image/jpeg", 0.85); }; img.src = r.result; };
    r.readAsDataURL(file); });
}

  return j.id;
}

let calView = ls.get("donri.calView","week"), calDate = today();
let outlook = {key:"", items:[], state:"idle"};
function calRange(){ const start = calView==="day" ? parse(calDate) : monday(parse(calDate)); const n = calView==="day" ? 1 : 7; return {start, n, days:[...Array(n)].map((_,i) => ymd(addDays(start,i)))}; }
async function loadOutlook(){
  const {days} = calRange(); const key = days[0] + "|" + days[days.length-1];
  if(outlook.key === key && outlook.state !== "error") return;
  outlook = {key, items:[], state:"loading"};
  try{
    const q = new URLSearchParams({startDateTime:days[0]+"T00:00:00", endDateTime:ymd(addDays(parse(days[days.length-1]),1))+"T00:00:00", $select:"subject,start,end,isAllDay", $orderby:"start/dateTime", $top:"100"});
    const j = await graphJson("/me/calendarView?" + q.toString(), {headers:{Prefer:'outlook.timezone="GMT Standard Time"'}});
    if(outlook.key !== key) return;
    outlook.items = (j.value||[]).map(e => ({title:e.subject, date:e.start.dateTime.slice(0,10), start:e.isAllDay ? "" : e.start.dateTime.slice(11,16)}));
    outlook.state = "ok";
  }catch(e){ outlook.state = "error"; }
  if(sheetRender && $("#sheetTitle") && $("#sheetTitle").textContent === "Family calendar") sheetRender();
}

// Add a family event (and, if asked, put it in your Outlook with the other adults invited)
async function createEvent(d){
  const evId = uid();
  put("events", evId, {title:d.title, date:d.date, start:d.start||"", end:d.end||"", who:d.who||"", note:d.note||"", src:d.src||"", by:myName(), outlook:false});
  log(`added "${d.title}" on ${nice(d.date)}${d.src === "school" ? " (from a school email)" : ""}`);
  if(!d.quiet) notify("calendar", "New family event", `${myName()} added ${d.title}, ${nice(d.date)}${d.start ? " at " + d.start : ""}`, {tags:["calendar"]});
  if(!d.outlook) return {evId, ok:true, att:[], skipped:true};
  const att = adults().filter(m => m.email && m.name !== myName() && (!me || m.email !== me.email)).map(m => ({emailAddress:{address:m.email, name:m.name}, type:"required"}));
  const allDay = !d.start; const s = d.start || "00:00";
  const endT = allDay ? null : (d.end && d.end > s ? d.end : pad(Math.min(23, Number(s.slice(0,2))+1)) + s.slice(2));
  const body = {subject:d.title, body:{contentType:"text", content:(d.who ? "Who: " + d.who + "\n\n" : "") + (d.note ? d.note + "\n\n" : "") + "Added from Donrí"}, isAllDay:allDay,
    start:{dateTime:`${d.date}T${allDay ? "00:00" : s}:00`, timeZone:"GMT Standard Time"},
    end:{dateTime: allDay ? `${ymd(addDays(parse(d.date),1))}T00:00:00` : `${d.date}T${endT}:00`, timeZone:"GMT Standard Time"}, attendees:att};
  try{ const ev = await graphJson("/me/events", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
    patch("events", evId, {outlook:true, outlookId:ev.id}); outlook.key = ""; olToday.at = 0; return {evId, ok:true, att}; }
  catch(err){ return {evId, ok:false, att}; }
}

function sugForm(id){
  const x = doc("suggest", id); if(!x) return;
  openSheet("Change before adding", () => `<form class="card" data-form="sugSave" data-id="${esc(id)}">
    <label class="f" for="sgT">What</label><input id="sgT" type="text" name="title" value="${esc(x.title||'')}">
    <label class="f" for="sgD">Date</label><input id="sgD" type="date" name="date" value="${esc(x.date||'')}">
    <div class="row"><div class="grow"><label class="f" for="sgS">Start (empty for all day)</label><input id="sgS" type="time" name="start" value="${esc(x.start||'')}"></div><div class="grow"><label class="f" for="sgE">End</label><input id="sgE" type="time" name="end" value="${esc(x.end||'')}"></div></div>
    <label class="f" for="sgW">Who</label><input id="sgW" type="text" name="who" value="${esc(x.who||'')}">
    <label class="f" for="sgN">Note (things to bring or remember)</label><input id="sgN" type="text" name="note" value="${esc(x.note||'')}">
    <label class="toggle"><input type="checkbox" name="outlook" ${sugOutlook ? 'checked' : ''}> <span>Also add to our Outlook calendars</span></label>
    <div class="row wrap" style="margin-top:12px"><button class="btn primary" type="submit">Add to calendar</button><button class="btn" type="button" data-act="sugReview">Back</button></div></form>`);
}
async function addSuggestion(x, fields, quiet){
  const d = {title:x.title, date:x.date, start:x.start||"", end:x.end||"", who:x.who||"", note:x.note||"", ...(fields||{})};
  const r = await createEvent({...d, src:"school", quiet:true, outlook:fields && "outlook" in fields ? fields.outlook : sugOutlook});
  patch("suggest", x.id, {...d, status:"added", decidedBy:myName(), decidedAt:Date.now(), eventId:r.evId});
  if(!quiet) notify("calendar", "New family event", `${myName()} added ${d.title}, ${nice(d.date)}${d.start ? " at " + d.start : ""} (from a school email)`, {tags:["calendar"]});
  return r;
}
function schoolForm(){
  const ss = schoolSettings().senders || []; const rows = [...ss, {}].slice(0, Math.max(ss.length + 1, 3));
  return `<form class="card" data-form="saveSchool"><p class="muted small" style="margin-top:0">Claude only looks at emails from these senders. Use their email address, or just the part after the @ (for example <b>scoilmhuire.ie</b>).</p>
    ${rows.map((s,i) => `<div style="border-top:${i?'1px solid var(--line)':'0'};padding-top:${i?'8px':'0'}"><div class="row"><div class="grow"><label class="f" for="scN${i}">Name</label><input id="scN${i}" type="text" name="n${i}" value="${esc(s.name||'')}" placeholder="e.g. Donnacha's school"></div>
      <div style="width:120px"><label class="f" for="scK${i}">For</label><select id="scK${i}" name="k${i}"><option value="">Everyone</option>${kids().map(k => `<option ${s.kid===k.name?'selected':''}>${esc(k.name)}</option>`).join("")}</select></div></div>
      <label class="f" for="scM${i}">Email address or the part after @</label><input id="scM${i}" type="text" name="m${i}" value="${esc(s.match||'')}" placeholder="e.g. office@scoilmhuire.ie"></div>`).join("")}
    <div style="margin-top:12px"><button class="btn primary" type="submit">Save</button></div></form>`;
}

function personSheet(id){
  openSheet("Gifts", () => {
    const p = doc("people", id); if(!p) return `<div class="empty">This person was removed.</div>`;
    const gs = docs("gifts").filter(g => g.personId===id).sort((a,b) => (b.year||0)-(a.year||0));
    const sec = (st,label) => { const l = gs.filter(g => g.status===st); return l.length ? `<h2>${label}</h2><div class="card">${l.map(g => `<div class="item"><div class="grow"><b>${esc(g.item)}</b><div class="muted small">${esc(g.occasion||'')} ${esc(g.year||'')}${g.price?' · €'+esc(g.price):''}${g.why?' · '+esc(g.why):''}</div></div>
      ${st==='idea'?`<button class="btn sm" data-act="giftStatus" data-id="${esc(g.id)}" data-v="bought">Bought</button>`:''}${st==='bought'?`<button class="btn sm" data-act="giftStatus" data-id="${esc(g.id)}" data-v="given">Given</button>`:''}
      <button class="x" data-act="delGift" data-id="${esc(g.id)}" aria-label="Delete ${esc(g.item)}">${ICON.x}</button></div>`).join("")}</div>` : ""; };
    const bd = p.birthday ? p.birthday.split("-") : null;
    return `<div class="card"><b style="font-size:20px">${esc(p.name)}</b> <span class="muted">${esc(p.relation||'')}</span>
      <div class="muted small">${bd?'Birthday '+Number(bd[1])+' '+MONTHS[Number(bd[0])-1]:''}${p.age?' · age '+esc(p.age):''}${p.budget?' · budget €'+esc(p.budget):''}</div>
      ${p.interests?`<div class="small" style="margin-top:6px">Into: ${esc(p.interests)}</div>`:''}
      <div class="row wrap" style="margin-top:10px"><button class="btn sm" data-act="editPerson" data-id="${esc(id)}">Edit</button><button class="btn sm danger" data-act="delPerson" data-id="${esc(id)}">Remove</button></div></div>
      <h2>Log a gift</h2>
      <form class="card" data-form="addGift" data-id="${esc(id)}">
        <label class="f" for="gI">Gift</label><input id="gI" type="text" name="item" placeholder="e.g. Lego Technic set">
        <div class="row"><div class="grow"><label class="f" for="gO">Occasion</label><select id="gO" name="occasion"><option>Birthday</option><option>Christmas</option><option>Communion</option><option>Confirmation</option><option>Other</option></select></div>
        <div style="width:96px"><label class="f" for="gY">Year</label><input id="gY" type="number" name="year" value="${new Date().getFullYear()}"></div></div>
        <div class="row"><div class="grow"><label class="f" for="gS">Status</label><select id="gS" name="status"><option value="idea">Idea</option><option value="bought">Bought</option><option value="given">Given</option></select></div>
        <div style="width:96px"><label class="f" for="gP">Price €</label><input id="gP" type="number" name="price"></div></div>
        <div style="margin-top:12px"><button class="btn primary" type="submit">Save gift</button></div></form>
      ${sec("idea","Ideas")}${sec("bought","Bought, not given yet")}${sec("given","Already given")}`;
  });
}

function gpSummary(){
  const who = hWho(); const sides = sidesFor(who); const isAdult = adults().some(m => m.name === who);
  const L = [`Health summary for ${who} (from Donrí, ${nice(today())})`, "", "Medicines:"];
  const meds = docs("meds").filter(m => (m.forWho||"") === who && visible(m));
  L.push(...(meds.length ? meds.map(m => `- ${m.name}${m.strength?" "+m.strength:""}, ${m.perDay||"?"} a day${m.forCondition?" (for "+m.forCondition+")":""}`) : ["- None listed"]));
  L.push("", "Allergies:"); const als = docs("allergies").filter(a => a.person === who); L.push(...(als.length ? als.map(a => `- ${a.allergen} (${a.severity||"severity not noted"})${a.reaction ? ": " + a.reaction : ""}`) : ["- None listed"]));
  L.push("", "Conditions:"); const cs = docs("conditions").filter(c => c.person === who && visible(c));
  L.push(...(cs.length ? cs.map(c => `- ${c.name}${c.since?" (since "+c.since+")":""}${c.notes?": "+c.notes:""}`) : ["- None listed"]));
  L.push("", "Family history:"); const hs = docs("history").filter(h => sides.includes(h.side) && visible(h));
  L.push(...(hs.length ? hs.map(h => `- ${h.condition}: ${isAdult ? (h.relative||"relative") : h.side+"'s "+(h.relative||"relative").toLowerCase()}${h.notes?", "+h.notes:""}`) : ["- None listed"]));
  const vs = docs("visits").filter(v => v.person === who && visible(v)).sort((a,b) => String(b.date).localeCompare(String(a.date))).slice(0,5);
  L.push("", "Recent visits:"); L.push(...(vs.length ? vs.map(v => `- ${fmtDate(v.date)}: ${v.kind||"Visit"}${v.reason?", "+v.reason:""}${v.notes?" ("+v.notes+")":""}`) : ["- None listed"]));
  if(!isAdult){
    const vx = docs("vaccines").filter(v => v.person === who && visible(v)).sort((a,b) => String(a.date).localeCompare(String(b.date)));
    L.push("", "Vaccinations recorded:"); L.push(...(vx.length ? vx.map(v => `- ${v.name}${v.dose?" ("+v.dose+")":""}, ${fmtDate(v.date)}${v.where?", "+v.where:""}`) : ["- None listed"]));
    const g = docs("growth").filter(x => x.person === who).sort((a,b) => String(b.date).localeCompare(String(a.date)));
    const h = g.find(x => Number(x.heightCm)), w = g.find(x => Number(x.weightKg));
    if(h || w){ L.push("", "Latest measurements:"); if(h) L.push(`- Height ${h.heightCm} cm (${fmtDate(h.date)})`); if(w) L.push(`- Weight ${w.weightKg} kg (${fmtDate(w.date)})`); }
  }
  return L.join("\n");
}

// Give one person edit access to one OneDrive item. Tries a quiet invite (no email from Microsoft) first;
// some new personal accounts aren't allowed to invite, so it falls back to a private edit link carried in the Donrí invite.
async function grantAccess(itemId, email){
  for(const quiet of [true, false]){
    try{ await graphJson(`/drives/${cfg.d}/items/${itemId}/invite`, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({recipients:[{email}], roles:["write"], requireSignIn:true, sendInvitation:!quiet})}); return {ok:true}; }
    catch(e){ if(e.status === 401) throw e; }
  }
  const j = await graphJson(`/drives/${cfg.d}/items/${itemId}/createLink`, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({type:"edit", scope:"anonymous"})});
  return {ok:true, link:j.link && j.link.webUrl};
}

  if(kind === "saveRecipe"){ const title = (fd.title||"").trim(); if(!title) return; const rid = id || uid(); const old = doc("recipes", id) || {};
    put("recipes", rid, {title, icon:fd.icon||"🍲", time:fd.time||"", serves:fd.serves||"4", tags:(fd.tags||"").split(",").map(s => s.trim()).filter(Boolean), ingredients:parseLines(fd.ingredients||""), method:(fd.method||"").trim(), notes:(fd.notes||"").trim(), link:(fd.link||"").trim(), by:old.by||myName()});
    if(!id) log(`added a recipe: ${title}`); recipeSheet(rid); toast("Recipe saved"); return; }
  if(kind === "saveRenew"){ const k = RENEW_KINDS[fd.kind] || RENEW_KINDS.other; const title = (fd.title||"").trim() || k.label; if(!fd.due) return;
    const old = doc("renewals", id) || {};
    put("renewals", id || uid(), {kind:fd.kind||"other", title, forWhat:(fd.forWhat||"").trim(), due:fd.due, every:Number(fd.every)||0, cost:fd.cost||"", remindDays:Number(fd.remindDays)||30, autoRenews:!!fd.autoRenews, notes:(fd.notes||"").trim(), notifiedFor: old.due === fd.due ? (old.notifiedFor||"") : ""});
    closeSheet(); toast("Saved"); checkRenewalReminders(); return; }
  if(kind === "renewDoneSave"){ const r = doc("renewals", id); if(!r) return;
    if(Number(r.every) && fd.due){ patch("renewals", id, {due:fd.due, cost:fd.cost||r.cost||"", notifiedFor:"", lastDone:today(), lastBy:myName()}); }
    else del("renewals", id);
    log(`renewed ${r.title}${r.forWhat ? " (" + r.forWhat + ")" : ""}`);
    notify("renewals", "Renewed", `${myName()} renewed ${r.title}${r.forWhat ? " (" + r.forWhat + ")" : ""}`, {tags:["white_check_mark"]});
    closeSheet(); toast(`${r.title} renewed${Number(r.every) && fd.due ? ". Next due " + nice(fd.due) : ""}`, 4500); return; }
  if(kind === "saveSchool"){ const ss = [];
    for(let i = 0; i < 12; i++){ const n = (fd["n"+i]||"").trim(), m = (fd["m"+i]||"").trim().toLowerCase(); if(!n && !m) continue; ss.push({name:n || m, match:m, kid:fd["k"+i]||""}); }
    put("settings","school",{senders:ss}); toast("School and crèche senders saved"); return; }
});
document.addEventListener("input", e => {
  if("rsearch" in e.target.dataset){ const q = e.target.value.trim().toLowerCase(); document.querySelectorAll("[data-find]").forEach(c => { c.hidden = q && !c.dataset.find.includes(q); }); }
});
document.addEventListener("keydown", e => { if(e.key === "Enter" && e.target && e.target.id === "reTagNew"){ e.preventDefault(); const b = document.querySelector('[data-act=rtagAdd]'); if(b) b.click(); } });
document.addEventListener("change", e => {
  const el = e.target;
  if(el.dataset.meal){ const d = el.dataset.meal; const cur = doc("meals", d) || {}; const val = el.value.trim(); if(val === (cur.dinner||"")) return;
    put("meals", d, {dinner:val, ingredients:[]}); if(val) notify("meals", "Meal plan", `${myName()}: ${nice(d)} dinner is ${val}`, {tags:["fork_and_knife"]}); }
  if(el.dataset.recipefilter){ recipeTag = el.value; render(); }
  if(el.dataset.rtag){ const v = el.value; if(v === "__new"){ const row = document.getElementById("reTagNewRow"); if(row){ row.hidden = false; document.getElementById("reTagNew").focus(); } el.value = ""; } else if(v){ rtagSet([...rtagChosen(), v]); } }
  if("sugol" in el.dataset){ sugOutlook = el.checked; }
  if(el.dataset.kidpref){ const key = el.dataset.kidpref, ks = kidSettings(); put("settings","kids",{...ks, [key]:{...(ks[key] || {}), [el.dataset.v]:el.checked}}); }
  if("playmins" in el.dataset){ put("settings","kids",{...kidSettings(), playMins:Number(el.value)||10}); }
  if("kidapprove" in el.dataset){ put("settings","kids",{...kidSettings(), approval:el.checked}); }
  if("rkind" in el.dataset){ const k = RENEW_KINDS[el.value]; const f = el.form; if(k && f){ f.every.value = String(k.every); f.remindDays.value = String(k.remind); f.autoRenews.checked = !!k.auto; } }
  if(el.dataset.notify){ const s = settings(); const ms = (s.members||[]).map(m => m.name === myName() ? {...m, notify:{...NOTIFY_DEFAULT, ...(m.notify||{}), [el.dataset.notify]:el.checked}} : m); put("settings","family",{...settings(), members:ms}); }
});

// =====================================================================
// Start
// =====================================================================
(async () => {
  // Invite link: #join=...
  const h = location.hash || "";
  if(h.startsWith("#join=")){
    try{ const j = decJoin(h.slice(6)); if(j.c && j.d && j.i){ if(cfg.d && cfg.d !== j.d){ D = null; etag = null; dirty = false; persist(); } cfg = {...cfg, c:j.c, d:j.d, i:j.i}; ls.set("donri.cfg", cfg); const rl = [j.s, j.p].filter(Boolean); if(rl.length) ls.set("donri.redeem", rl); } }catch(e){ toast("That invite link looks incomplete."); }
    history.replaceState(null, "", REDIRECT);
  }
  await handleRedirect();
  render();
  if(tok){
    if(!me) await loadMe();
    const rl = ls.get("donri.redeem", []);
    if(rl.length){ const left = []; for(const u of rl){ try{ await graphJson(`/shares/${shareId(u)}/driveItem`, {headers:{Prefer:"redeemSharingLink"}}); }catch(e){ left.push(u); } } if(left.length) ls.set("donri.redeem", left); else ls.del("donri.redeem"); }
    if(cfg.d){ await sync(true);
      if(!myName() && me){ const m = members().find(x => x.email && x.email === me.email); if(m) ls.set("donri.who", m.name); }
      render(); }
    else render();
  }
  if(tok && cfg.d && startLink[1]) goLink(startLink.join("/"));
  window.addEventListener("hashchange", () => { const h = location.hash.replace("#",""); if(h && !h.startsWith("join=") && h !== page) goLink(h); });
  if(myName() && cfg.d && !ls.get("donri.introSeen", false)) setTimeout(introPlay, 600);
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
})();
</script>
